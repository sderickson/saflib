name: Setup Node dependencies
description: >-
  Setup Node.js, restore ~/.npm and node_modules caches, and run npm ci only on
  cache miss. Skipping npm ci on a warm node_modules cache is much faster than
  re-extracting the full monorepo tree on every job.
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node-${{ inputs.node-version }}-

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

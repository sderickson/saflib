type: object
properties:
  id:
    type: integer
    readOnly: true
    description: Unique identifier for the job setting.
  job_name:
    type: string
    description: The unique name of the cron job.
  enabled:
    type: boolean
    description: Whether the job is enabled to run.
  enabled_by:
    type: [ string, "null" ]
    description: >
      Kratos identity id of the admin who last enabled the job. Null for pre-migration rows until re-enabled. Ticks skip when enabled with null.
  last_run_at:
    type: [ string, "null" ]
    format: date-time
    description: Timestamp of the last time the job ran.
  last_run_status:
    type: [ string, "null" ]
    enum: [ "success", "fail", "running", "timed out", null ]
    description: Status of the last job run.
  schedule:
    type: [ string, "null" ]
    readOnly: true
    description: Cron schedule string from the registered JobsMap (e.g. `*/15 * * * *`).
  runs_next_at:
    type: [ string, "null" ]
    format: date-time
    readOnly: true
    description: >
      Next scheduled tick when the job is enabled; null when disabled or schedule is unknown.
  created_at:
    type: string
    format: date-time
    readOnly: true
    description: Timestamp when the job setting was created.
  updated_at:
    type: string
    format: date-time
    readOnly: true
    description: Timestamp when the job setting was last updated.
required:
  - job_name
  - enabled

openapi: 3.1.0
info:
  title: Cron Service API
  version: 1.0.0
  description: API specification for the cron service

servers:
  - url: http://cron.docker.localhost/
    description: Development server

components:
  securitySchemes:
    session:
      $ref: "pkg:@saflib/openapi/security-schemes/session.yaml"
  schemas:
    JobSettings:
      $ref: "./schemas/job_settings.yaml"

paths:
  /cron/jobs:
    get:
      $ref: "./routes/cron_routes.yaml#/get"
  /cron/jobs/settings:
    put:
      $ref: "./routes/cron_routes.yaml#/put"

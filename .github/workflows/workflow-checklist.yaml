name: Workflows Checklists

on:
  pull_request:
    branches:
      - main

jobs:
  workflow-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Run every workflow checklist. This should error if any error
      - name: Run Workflow Integration Test
        run: npm exec saf-workflow list -- -a | xargs -n 1 npm exec saf-workflow checklist

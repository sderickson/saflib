name: Workflows Checklists

on:
  pull_request:
    branches:
      - main

jobs:
  workflow-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Run every workflow checklist. This should error if any error
      - name: Run Workflow Integration Test
        run: npm exec saf-workflow list -- -a | xargs -n 1 npm exec saf-workflow checklist

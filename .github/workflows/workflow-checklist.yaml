name: Workflows Checklists

on:
  pull_request:
    branches:
      - main

jobs:
  workflow-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Run every workflow checklist. This should error if any error
      - name: Run Workflow Integration Test
        run: npm exec saf-workflow list -- -a | xargs -n 1 npm exec saf-workflow checklist

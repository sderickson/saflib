name: Run Unit Tests for PRs

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          # Bit of a hack so tests pass. Might move these tests elsewhere.
          # BEGIN WORKFLOW AREA test-product-dependencies FOR product/init
          - saflib
          # END WORKFLOW AREA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm install

      # Tests fail to run if this one package isn't installed
      - name: Install rollup for linux
        run: npm install @rollup/rollup-linux-x64-gnu

      - name: Run Unit Tests
        run: npm run test

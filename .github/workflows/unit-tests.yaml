name: Run Unit Tests for PRs

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          # Bit of a hack so tests pass. Might move these tests elsewhere.
          # BEGIN WORKFLOW AREA test-product-dependencies FOR product/init
          - saflib
          # END WORKFLOW AREA
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm install

      # Tests fail to run if this one package isn't installed
      - name: Install rollup for linux
        run: npm install @rollup/rollup-linux-x64-gnu

      - name: Run Unit Tests
        run: npm run test

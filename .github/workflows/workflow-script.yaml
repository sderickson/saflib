name: Workflow live-test

on:
  pull_request:
    branches:
      - main

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Copy base → tmp, run each live-test set (script mode), typecheck per set, delete tmp.
      - name: Run workflow live-test
        run: npm run live-test --workspace=@saflib/workflows-cli

      - name: Git status (should be clean of tmp/)
        if: always()
        run: git status -uall

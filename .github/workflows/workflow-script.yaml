name: Phase 1 vertical-slice workflows

on:
  pull_request:
    branches:
      - main

jobs:
  phase1-vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Copy base → tmp, run Phase 1 add-* (script mode), typecheck, delete tmp.
      - name: Run Phase 1 vertical-slice workflow smoke
        run: npm exec saf-workflow run-scripts ./workflows-cli/test-phase1-vertical-slice.ts

      - name: Git status (should be clean of tmp/)
        if: always()
        run: git status -uall

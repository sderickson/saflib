type: object
additionalProperties: false
required:
  - index
  - kind
properties:
  index:
    type: integer
    minimum: 0
  kind:
    type: string
    example: "call-workflow"
  label:
    type: string
    description: Best-effort human-readable summary of the step's input.
    example: "drizzle/add-query"
  params:
    type: object
    additionalProperties:
      type: string
    description: >
      Key/value breakdown of this step's own input fields (e.g. a
      call-workflow step's targetInput), for a detail list in the UI
      instead of cramming everything into `label`.
    example: { path: "./schemas/todo.ts" }

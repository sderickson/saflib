type: object
additionalProperties: false
required:
  - path
  - index
  - kind
  - isCurrent
properties:
  path:
    type: string
    description: Slash-separated indices from the root (e.g. `2/4`).
    example: "2/4"
  index:
    type: integer
    minimum: 0
    description: Step index within this node's own workflow definition.
  kind:
    type: string
    example: "call-workflow"
  label:
    type: string
    description: Best-effort human label for the step.
  isCurrent:
    type: boolean
    description: True when this node is on the active breadcrumb.
  runId:
    type: string
    description: >
      Owning run id when one exists. Absent for nested outline rows under
      a `call-workflow` that has not created a child yet.
  children:
    type: array
    items:
      $ref: "./workflow-step-tree-node.yaml"

type: object
description: >
  One log line for a run — the wire form of a `workflow_log` row
  (`new-workflows-db/schemas/workflow-log.ts`).
additionalProperties: false
required:
  - id
  - seq
  - run_id
  - step_index
  - channel
  - level
  - content
  - created_at
  - source_run_id
  - source_step_index
properties:
  id:
    type: string
    example: "aBcD1234"
  seq:
    type: integer
    description: >
      Insertion order within the log table. The total order of log rows and
      the pagination cursor — `created_at` is second-precision and ties.
    example: 1042
  run_id:
    type: string
    example: "0SG36FJe6m4W"
  step_index:
    type: [integer, "null"]
  channel:
    $ref: "./workflow-log-channel.yaml"
  level:
    $ref: "./workflow-log-level.yaml"
  content:
    type: string
    example: "Generated \"example-thing.ts\" from template"
  created_at:
    type: string
    format: date-time
  source_run_id:
    type: [string, "null"]
    description: >
      The run that produced this line. Differs from `run_id` when a nested
      `call-workflow` child produced it (its output is filed under the
      root run's step). Null on lines written before this was tracked.
    example: "7fQx2LmN9pA1"
  source_step_index:
    type: [integer, "null"]
    description: >
      Step index within `source_run_id` that produced this line. Null on
      lines written before this was tracked.

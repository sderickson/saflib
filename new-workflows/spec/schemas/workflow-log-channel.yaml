type: string
description: >
  Which output channel a log line belongs to, so a renderer (CLI or web)
  can style/route it distinctly instead of guessing from content.
  `terminal`: raw stdout/stderr from a subprocess the workflow ran (vite,
  npm, git). `agent`: output from the coding agent (what it said, what it
  executed). `tool`: the workflow engine's own narration (e.g. "running
  step 3: copy"). `agent-input`: the prompt text sent to the agent.
enum:
  - terminal
  - agent
  - tool
  - agent-input
example: "tool"

type: object
description: >
  A step's commit that changed files outside its run's declared scope (the
  `files` of the run's prompt steps, plus files its copy steps wrote).
additionalProperties: false
required:
  - workflow_ref
  - run_id
  - step_index
  - files
properties:
  workflow_ref:
    type: string
    description: The run's workflow file, relative to the repo root.
    example: "test-product/plans/2026-09-15-add-widgets/phase-2-api.workflow.yaml"
  run_id:
    type: string
    example: "0SG36FJe6m4W"
  step_index:
    type: integer
    minimum: 0
    example: 7
  label:
    type: string
    description: The step's label, as in its commit message.
    example: "npm run test"
  commit_hash:
    type: string
    description: The commit holding the step's changes.
    example: "12cd003edb9ae8411c6990e4c84984e4b9e735d7"
  files:
    type: array
    description: Changed files outside the run's scope, relative to the repo root.
    items:
      type: string
    example: ["test-product/security/vitest.config.js"]

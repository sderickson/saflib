createPlan:
  summary: Save a new plan (a config-defined workflow) to the plans folder
  description: >
    Writes `<plansRoot>/<date>-<name>/<name>.yaml` with the given config
    body. Doesn't run it — see POST /workflows/{id}/runs with the returned
    file's `path` as `id`.
  operationId: createPlan

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - name
            - body
          properties:
            name:
              type: string
              description: kebab-case slug used for the folder and file name.
              example: "add-list-users-query"
            body:
              $ref: "../../openapi.yaml#/components/schemas/WorkflowConfigBody"

  responses:
    "201":
      description: Plan created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - plan
            properties:
              plan:
                $ref: "../../openapi.yaml#/components/schemas/PlanSummary"
    "400":
      description: Invalid plan name or config body.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "500":
      description: This host hasn't configured a plans folder.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

getWorkflowSteps:
  summary: List a workflow's steps, without needing a run
  description: >
    Same shape as `getWorkflowRunSteps`, but resolved straight from the
    workflow definition (a registered code id, or a plan file path) rather
    than an existing run's `workflow_ref` — for showing the sidebar/outline
    before a workflow has ever been started.
  operationId: getWorkflowSteps

  parameters:
    - name: id
      in: path
      required: true
      description: >
        A registered workflow's id, or a plan file's `path` (from
        GET /plans) — same value as POST /workflows/{id}/runs takes.
      schema:
        type: string
        example: "example/hello"

  responses:
    "200":
      description: The workflow's steps, in execution order.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - steps
            properties:
              steps:
                type: array
                items:
                  $ref: "../../openapi.yaml#/components/schemas/WorkflowRunStep"
    "404":
      description: No workflow or plan file with that id/path.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

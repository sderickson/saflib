listWorkflowRunLogs:
  summary: List a run's logs
  description: >
    Newest-first, cursor-paginated by each row's `seq` (insertion order —
    `created_at` is only second-precision, so it can't be a cursor). Pass
    `before_seq` to page older history for infinite scroll; pass
    `after_seq` for rows newer than a known tip (e.g. after an SSE change hint). Pass `step_index`
    to anchor the first page at that step so a sidebar jump can load a
    window that is not the live tip. The client re-fetches rather than
    getting log content pushed over the wire.
  operationId: listWorkflowRunLogs
  x-public: true

  parameters:
    - name: runId
      in: path
      required: true
      schema:
        type: string
        example: "0SG36FJe6m4W"
    - name: after_seq
      in: query
      required: false
      description: Only rows with `seq` greater than this (newer than tip).
      schema:
        type: integer
    - name: before_seq
      in: query
      required: false
      description: Only rows with `seq` less than this (older page).
      schema:
        type: integer
    - name: step_index
      in: query
      required: false
      description: >
        Anchor this page at the earliest log for that step, then the
        following `limit` rows (still returned newest-first).
      schema:
        type: integer
        minimum: 0
    - name: anchor_seq
      in: query
      required: false
      description: >
        Anchor this page at the row with this `seq` (e.g. a direct message
        from `GET /runs/{runId}/messages`), then the following `limit` rows.
      schema:
        type: integer
    - name: contiguous
      in: query
      required: false
      description: >
        With `after_seq`, return the oldest `limit` rows after the cursor
        (the next page toward the present) instead of the newest ones.
      schema:
        type: boolean
    - name: limit
      in: query
      required: false
      description: Page size (default 100).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        example: 100

  responses:
    "200":
      description: Log rows, newest first, plus whether another older/newer page may exist.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - logs
              - has_more
              - has_more_newer
            properties:
              logs:
                type: array
                items:
                  $ref: "../../openapi.yaml#/components/schemas/WorkflowLogEntry"
              has_more:
                type: boolean
                description: >
                  True when another older page (`before_seq` the oldest row
                  here) may return more rows.
              has_more_newer:
                type: boolean
                description: >
                  True when another newer page (`after_seq` the newest row
                  here, `contiguous`) may return more rows. False on the
                  live tip.
    "404":
      description: No run with that id.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

advanceWorkflowRun:
  summary: Run the next step of a run
  description: >
    The HTTP face of `new-workflows/lib`'s single "run next step" entry
    point — the caller (this endpoint's caller) decides whether/when to
    call it again. Persists the step's output to `workflow_logs` and
    publishes a change hint on this run's SSE channel as a side effect.
  operationId: advanceWorkflowRun

  parameters:
    - name: runId
      in: path
      required: true
      schema:
        type: string
        example: "0SG36FJe6m4W"

  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          description: >
            Recovery options for re-advancing a run that's currently
            `failed` — omit entirely for a normal advance. `revert` and
            `skip` are mutually exclusive; `skip` wins if both are set.
          properties:
            revert:
              type: boolean
              description: >
                Discard uncommitted changes in the run's repo (whatever
                the failed step itself left behind) before retrying it.
                Repo-wide and destructive — see `revertUncommittedChanges`.
              default: false
            skip:
              type: boolean
              description: >
                Skip the current step entirely instead of running it:
                commits whatever's currently dirty (if anything) and
                advances past it, same as a successful run of it.
              default: false
            extraPrompt:
              type: string
              description: >
                Prepended to whatever prompt this step call sends the
                agent (update/prompt steps only). Ignored when `skip` is
                set — nothing gets prompted.
              example: "Use ignorePlural, the table name is already singular."

  responses:
    "200":
      description: Outcome of the step that just ran.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/StepResult"
    "404":
      description: No run with that id.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

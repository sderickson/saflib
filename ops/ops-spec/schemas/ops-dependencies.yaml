type: object
description: >
  The latest check of this image's installed packages (its lockfile) against
  OSV.dev advisories and the npm registry, and of its runtime (Node, base OS)
  against endoflife.date. Checked a couple of minutes after a deploy and then
  daily.
required: [ checked_at, stale, packages_total, direct_total, node_version, lockfile_hash, advisories, outdated, runtime, errors ]
properties:
  checked_at:
    type: string
    format: date-time
  stale:
    type: boolean
    description: No successful check in the last 72 hours.
  packages_total:
    type: integer
  direct_total:
    type: integer
  node_version:
    type: string
  lockfile_hash:
    type: string
  advisories:
    type: array
    description: Most severe first.
    items:
      type: object
      required: [ id, aliases, severity, package, deployed, fixed_in, direct, actionable, accepted, untrusted ]
      properties:
        id:
          type: string
          description: OSV id (usually a GHSA).
        aliases:
          type: array
          items: { type: string }
        severity:
          type: string
          enum: [ critical, high, moderate, low, unknown ]
        package:
          type: string
        deployed:
          type: string
        fixed_in:
          type: [ string, "null" ]
          description: Lowest fixed version above the deployed one.
        direct:
          type: boolean
          description: A direct dependency of the image's packages (else pulled in transitively; fix via the parent or npm overrides).
        actionable:
          type: boolean
          description: High or critical, and not accepted.
        accepted:
          description: >
            Set when the product accepted this advisory for now (no upstream
            fix, unused code path); it then isn't actionable.
          oneOf:
            - type: "null"
            - type: object
              required: [ reason, until ]
              properties:
                reason: { type: string }
                until:
                  type: [ string, "null" ]
                  description: Last day the acceptance applies (YYYY-MM-DD).
        untrusted:
          type: object
          required: [ summary ]
          properties:
            summary:
              type: string
  outdated:
    type: array
    description: Direct dependencies with a newer release.
    items:
      type: object
      required: [ name, deployed, latest, latest_published_at, update, renovate_due ]
      properties:
        name: { type: string }
        deployed: { type: string }
        latest: { type: string }
        latest_published_at:
          type: [ string, "null" ]
          format: date-time
        update:
          type: string
          enum: [ major, minor, patch ]
        renovate_due:
          type: boolean
          description: The latest release is past the 3-day minimum release age, so Renovate should have a PR open.
  runtime:
    type: array
    description: >
      Pins outside the lockfile that age out on their own: the Node version,
      the container's base OS (moving means a new Dockerfile `FROM`), and the
      server's OS (moving means upgrading or replacing the host). Empty in
      reports from before this was checked.
    items:
      type: object
      required: [ scope, name, version, cycle, eol, eol_soon, latest_in_cycle ]
      properties:
        scope:
          type: string
          enum: [ image, host ]
          description: image is Node and the container's base OS; host is the server's OS (from node_os_info, when metrics are on).
        name:
          type: string
          description: endoflife.date product (nodejs, debian, alpine-linux, ubuntu).
        version: { type: string }
        cycle:
          type: string
          description: Release line (Node's major, Debian's major, Alpine's major.minor).
        eol:
          type: [ string, "null" ]
          description: End of security support (YYYY-MM-DD); null if unknown or unannounced.
        eol_soon:
          type: boolean
          description: EOL is past or within 90 days.
        latest_in_cycle:
          type: [ string, "null" ]
          description: Newest release in this cycle.
  errors:
    type: array
    description: Lookups that failed; the rest of the report stands.
    items: { type: string }

type: object
description: >
  One process start. `new_build` marks deploys (the build or the release
  differs from the previous start of the same service); the rest are
  restarts. Build fields come from the image's build metadata and are null
  outside built images. Release fields come from the stamp `saf-deploy`
  writes on every deploy, so config-only deploys (Kratos, Caddy, another
  image) show up too; they are null when no stamp is mounted.
required:
  - id
  - service_name
  - started_at
  - color
  - build_ref
  - image
  - input_hash
  - commit_root
  - commit_saflib
  - dirty
  - built_at
  - node_version
  - released_at
  - release_commit_root
  - release_commit_saflib
  - release_assets_hash
  - new_build
properties:
  id:
    type: string
  service_name:
    type: string
  started_at:
    type: string
    format: date-time
  color:
    type: [ string, "null" ]
    description: Blue-green color, when deployed that way.
  build_ref:
    type: [ string, "null" ]
  image:
    type: [ string, "null" ]
  input_hash:
    type: [ string, "null" ]
  commit_root:
    type: [ string, "null" ]
    description: Product repo commit the image was built from (`-dirty` suffix if inputs had uncommitted changes).
  commit_saflib:
    type: [ string, "null" ]
  dirty:
    type: [ boolean, "null" ]
  built_at:
    type: [ string, "null" ]
    format: date-time
  node_version:
    type: string
  released_at:
    type: [ string, "null" ]
    format: date-time
    description: When the deploy that started this process ran.
  release_commit_root:
    type: [ string, "null" ]
    description: Product repo commit the deploy ran from (`-dirty` if it had uncommitted changes). Can be newer than `commit_root`, since images are only rebuilt when their inputs change.
  release_commit_saflib:
    type: [ string, "null" ]
  release_assets_hash:
    type: [ string, "null" ]
    description: Hash of the deploy's remote-assets (compose, Kratos and Caddy config). A change with the same build means a config-only deploy.
  new_build:
    type: boolean

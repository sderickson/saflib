type: object
description: One status tile on the admin Overview.
required: [ key, group, label, value, detail, tone ]
properties:
  key:
    type: string
    description: Stable id, e.g. `issues`, `jobs`, `whatsapp-inbox`. The admin maps it to a page.
  group:
    type: string
    enum: [ system, traffic, customers ]
  label:
    type: string
  value:
    type: string
    description: The headline, e.g. "0 failed".
  detail:
    type: string
    description: A line of context, e.g. "Last 24h · none stuck".
  always_show:
    type: boolean
    description: >
      Show value and detail even when `ok`. Most rows say nothing when
      healthy; this is for rows whose value is the point (e.g. which
      endpoint is slowest).
  tone:
    type: string
    enum: [ ok, warn, bad ]
    description: >
      `ok` green, `warn` yellow (worth a look), `bad` red (needs action;
      counts toward attention). Every tile has one: a fact with no status
      belongs on its own page, not the Overview.

listOpsDiagnostics:
  summary: List observability self-test probes
  description: >
    The probes the Diagnostics page can run here, each with where its signal
    should land, and why it's skipped when something it needs (Prometheus,
    Alertmanager, the jobs queue) isn't configured. Site admins only.
  operationId: listOpsDiagnostics
  security:
    - session: [ site-admin ]
  responses:
    "200":
      description: The probes.
      content:
        application/json:
          schema:
            type: object
            required: [ probes ]
            properties:
              probes:
                type: array
                items:
                  $ref: "../schemas/ops-diagnostic-probe.yaml"
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Site admin required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

runOpsDiagnosticProbe:
  summary: Fire a server-side probe
  description: >
    Sends the probe's test signal, tagged `[diag:<run_id>]`. The
    `server-500` probe answers 500 on purpose: that is its signal.
  operationId: runOpsDiagnosticProbe
  security:
    - session: [ site-admin ]
  parameters:
    - { name: run_id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9]{6,32}$" } }
    - { name: probe_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties: {}
  responses:
    "202":
      description: Sent; poll the run for where it landed.
      content:
        application/json:
          schema:
            type: object
            required: [ started_at ]
            properties:
              started_at: { type: string, format: date-time }
    "404":
      description: No such probe.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "409":
      description: The probe can't run here (see its skip reason) or runs in the browser.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "500":
      description: The server-500 probe's intentional error.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

getOpsDiagnosticRun:
  summary: Where a run's signals landed
  description: For each probe, when its tagged signal showed up in its destination, if it has.
  operationId: getOpsDiagnosticRun
  security:
    - session: [ site-admin ]
  parameters:
    - { name: run_id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9]{6,32}$" } }
    - name: since
      in: query
      required: true
      description: When the run started; signals before it don't count.
      allowReserved: true
      schema: { type: string, format: date-time }
  responses:
    "200":
      description: Results so far.
      content:
        application/json:
          schema:
            type: object
            required: [ results ]
            properties:
              results:
                type: array
                items:
                  type: object
                  required: [ probe_id, landed_at, ref ]
                  properties:
                    probe_id: { type: string }
                    landed_at: { type: [ string, "null" ], format: date-time }
                    ref:
                      description: What landed, for a link (an issue id, job id, …).
                      oneOf:
                        - type: "null"
                        - type: object
                          required: [ kind, id ]
                          properties:
                            kind: { type: string, enum: [ issue, log, job, audit, alert ] }
                            id: { type: string }
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Site admin required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

clearOpsDiagnostics:
  summary: Clear test signals
  description: >
    Resolves every open issue a self-test created. Log lines, jobs and audit
    events stay (they're append-only or age out on their own).
  operationId: clearOpsDiagnostics
  security:
    - session: [ site-admin ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties: {}
  responses:
    "200":
      description: What was cleared.
      content:
        application/json:
          schema:
            type: object
            required: [ resolved_issues ]
            properties:
              resolved_issues: { type: integer }
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Site admin required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

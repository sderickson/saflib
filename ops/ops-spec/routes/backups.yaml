listOpsBackups:
  summary: Backups, newest first
  description: >
    The app's own backups of its databases (and Kratos's): daily, at each
    deploy, before migrations and by hand. Each is checked when made
    (integrity, per-table stats compared with the last good one), stored with
    a hash, and read back weekly. `configured` is false when the product has
    no backups store; the host's disk snapshots are the other layer.
  operationId: listOpsBackups
  security:
    - ops-token: [ "ops:read" ]
    - session: [ site-admin ]
  parameters:
    - name: days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 400
        default: 62
  responses:
    "200":
      description: Backups.
      content:
        application/json:
          schema:
            type: object
            required: [ configured, retention_days, databases, backups ]
            properties:
              configured:
                type: boolean
              retention_days:
                type: [ integer, "null" ]
              databases:
                type: array
                items: { type: string }
              backups:
                type: array
                items:
                  $ref: "../schemas/ops-backup.yaml"
    "401":
      description: Missing, malformed, unknown, revoked or expired token.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "429":
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

runOpsBackups:
  summary: Back up every database now
  description: Starts a manual backup of each database and returns right away. Site admins only.
  operationId: runOpsBackups
  security:
    - session: [ site-admin ]
  responses:
    "202":
      description: Started.
      content:
        application/json:
          schema:
            type: object
            required: [ started ]
            properties:
              started:
                type: boolean
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Not a site admin.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "404":
      description: Backups aren't configured.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

runOpsBackupsMaintenance:
  summary: Daily backup maintenance (run by the backups cron job)
  description: >
    Backs up each database (once per day), uploads snapshots taken before
    migrations, deletes backups past retention and reads back the latest
    ones. Enqueued by the product's `backups` cron job; safe to run again
    (each day's backup is claimed once). 200 with `configured: false` when
    the product has no backups store.
  operationId: runOpsBackupsMaintenance
  security:
    - session: [ site-admin ]
  tags:
    - background
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          description: Empty JSON object.
          properties: {}
  responses:
    "200":
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ configured, backed_up, failed, removed, verified ]
            properties:
              configured: { type: boolean }
              backed_up: { type: integer, description: Backups made (including uploaded pre-migration snapshots). }
              failed: { type: integer }
              removed: { type: integer, description: Backups deleted by retention. }
              verified: { type: integer, description: Backups read back. }
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Not a site admin.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

listOpsLogs:
  summary: Search persisted logs
  description: >
    Newest first. Filters combine with AND. `q` is free text matched word by
    word against messages. Page with `cursor` from `next_cursor`.
  operationId: listOpsLogs
  security:
    - ops-token: [ "ops:read" ]
  parameters:
    - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
    - { name: until, in: query, required: false, schema: { type: string, format: date-time } }
    - name: level
      in: query
      required: false
      description: This level and anything more severe.
      schema: { type: string, enum: [ error, warn, info, http, verbose, debug, silly ] }
    - { name: service, in: query, required: false, schema: { type: string, maxLength: 100 } }
    - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
    - { name: template, in: query, required: false, description: A template hash., schema: { type: string, maxLength: 64 } }
    - { name: request_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
    - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 32 } }
  responses:
    "200":
      description: Matching lines.
      content:
        application/json:
          schema:
            type: object
            required: [ logs, next_cursor ]
            properties:
              logs:
                type: array
                items:
                  $ref: "../schemas/ops-log-entry.yaml"
              next_cursor:
                type: [ string, "null" ]
    "401":
      description: Missing, malformed, unknown, revoked or expired token.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "404":
      description: Logs are not enabled for this product.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "429":
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

listOpsLogTemplates:
  summary: Message templates active in a window
  description: >
    Busiest first. With `only_new`, just templates first seen in the window,
    the "new behavior" signal. `since` defaults to 24 hours ago.
  operationId: listOpsLogTemplates
  security:
    - ops-token: [ "ops:read" ]
  parameters:
    - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
    - { name: only_new, in: query, required: false, schema: { type: boolean, default: false } }
    - { name: service, in: query, required: false, schema: { type: string, maxLength: 100 } }
    - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    "200":
      description: Templates with counts.
      content:
        application/json:
          schema:
            type: object
            required: [ since, templates ]
            properties:
              since:
                type: string
                format: date-time
              templates:
                type: array
                items:
                  $ref: "../schemas/ops-log-template.yaml"
    "401":
      description: Missing, malformed, unknown, revoked or expired token.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "404":
      description: Logs are not enabled for this product.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "429":
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"


resolveOpsIssue:
  summary: Resolve an issue
  description: >
    Marks it fixed. If it occurs again it becomes `regressed`.
  operationId: resolveOpsIssue
  security:
    - ops-token: [ "ops:triage" ]
    - session: [ site-admin ]
  parameters:
    - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            note:
              type: string
              maxLength: 500
              description: Why, e.g. "fixed in PR #42".
            resolved_in_version:
              type: string
              maxLength: 100
              description: Commit or release containing the fix.
  responses:
    "200":
      description: The issue.
      content:
        application/json:
          schema:
            type: object
            required: [ issue ]
            properties:
              issue:
                $ref: "../schemas/ops-issue.yaml"
    "401":
      description: Missing, malformed, unknown, revoked or expired token.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "404":
      description: Unknown issue, or issues are not enabled for this product.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "429":
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

ignoreOpsIssue:

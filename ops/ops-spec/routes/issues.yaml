listOpsIssues:
  summary: List issues
  description: >
    Defaults to everything, most recently seen first. Typical agent queries:
    `status=open&status=regressed&sort=window_count` (what's hurting now),
    `new=true` (first seen in the window), `regressed=true` (came back in the
    window). The window starts at `since` (default 24 hours ago).
  operationId: listOpsIssues
  security:
    - ops-token: [ "ops:read" ]
    - session: [ site-admin ]
  parameters:
    - name: status
      in: query
      required: false
      schema: { type: array, items: { type: string, enum: [ open, resolved, ignored, regressed ] } }
    - name: level
      in: query
      required: false
      schema: { type: array, items: { type: string, enum: [ warn, error, fatal ] } }
    - name: kind
      in: query
      required: false
      schema: { type: array, items: { type: string, maxLength: 32 } }
    - { name: since, in: query, allowReserved: true, required: false, schema: { type: string, format: date-time } }
    - { name: new, in: query, required: false, description: Only issues first seen in the window., schema: { type: boolean } }
    - { name: regressed, in: query, required: false, description: Only issues that regressed in the window., schema: { type: boolean } }
    - name: sort
      in: query
      required: false
      schema: { type: string, enum: [ last_seen, first_seen, count, window_count ], default: last_seen }
    - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 16 } }
  responses:
    "200":
      description: Issues.
      content:
        application/json:
          schema:
            type: object
            required: [ issues, next_cursor ]
            properties:
              issues:
                type: array
                items:
                  $ref: "../schemas/ops-issue.yaml"
              next_cursor:
                type: [ string, "null" ]
    "401":
      description: Missing, malformed, unknown, revoked or expired token.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "404":
      description: Unknown issue, or issues are not enabled for this product.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "429":
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"


  description: >
    Silences it, forever or until `until`, after which a new occurrence reopens it.
  operationId: ignoreOpsIssue
  security:
    - ops-token: [ "ops:triage" ]
    - session: [ site-admin ]
  parameters:
    - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
  requestBody:

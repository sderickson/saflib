listOpsAuditEvents:
  summary: Audit log, newest first
  description: >
    Who did what: sign-ins and account changes (`kratos.*`), admin actions,
    API calls the product audits. For spotting unusual activity: a burst of
    recoveries, a second factor removed, an admin action nobody remembers,
    sign-ins from a new IP. 404 when the product has no audit log.
  operationId: listOpsAuditEvents
  security:
    - ops-token: [ "ops:read" ]
    - session: [ site-admin ]
  parameters:
    - name: user_id
      in: query
      required: false
      description: Only events where this user is the actor or the one acted for.
      schema:
        type: string
    - name: event_prefix
      in: query
      required: false
      description: Only event types starting with this, e.g. `kratos.` or `kratos.settings.`.
      schema:
        type: string
    - name: since
      in: query
      required: false
      allowReserved: true
      description: Only events at or after this time.
      schema:
        type: string
        format: date-time
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: cursor
      in: query
      required: false
      description: "`next_cursor` from the previous page."
      schema:
        type: string
  responses:
    "200":
      description: A page of audit events.
      content:
        application/json:
          schema:
            type: object
            required: [ events, next_cursor ]
            properties:
              events:
                type: array
                items:
                  $ref: "../schemas/ops-audit-event.yaml"
              next_cursor:
                type: [ string, "null" ]
    "400":
      description: Invalid parameters or cursor.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "401":
      description: Missing, malformed, unknown, revoked or expired token.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "404":
      description: The product has no audit log.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "429":
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

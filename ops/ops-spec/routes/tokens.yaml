listOpsTokens:
  summary: List ops tokens (admin)
  operationId: listOpsTokens
  security:
    - session: [ site-admin ]
  responses:
    "200":
      description: Every token, newest first, including revoked and expired ones.
      content:
        application/json:
          schema:
            type: object
            required: [ ops_tokens ]
            properties:
              ops_tokens:
                type: array
                items:
                  $ref: "../schemas/ops-token.yaml"
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Not a site admin.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

createOpsToken:
  summary: Create an ops token (admin)
  description: >
    Mints a token. The plaintext `token` is in this response only; it cannot
    be retrieved again.
  operationId: createOpsToken
  security:
    - session: [ site-admin ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [ name, scopes ]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
            scopes:
              type: array
              minItems: 1
              items:
                type: string
                enum: [ "ops:read", "ops:triage", "ops:alerts-ingest", "ops:exchange" ]
            expires_at:
              type: [ string, "null" ]
              format: date-time
              description: Optional expiry; omit or null for no expiry.
  responses:
    "201":
      description: The new token.
      content:
        application/json:
          schema:
            type: object
            required: [ ops_token, token ]
            properties:
              ops_token:
                $ref: "../schemas/ops-token.yaml"
              token:
                type: string
                description: The secret, `safops_…`. Shown once.
    "400":
      description: Invalid request (e.g. expiry in the past).
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Not a site admin.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

revokeOpsToken:
  summary: Revoke an ops token (admin)
  operationId: revokeOpsToken
  security:
    - session: [ site-admin ]
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          description: Empty JSON object.
          properties: {}
  responses:
    "200":
      description: The revoked token.
      content:
        application/json:
          schema:
            type: object
            required: [ ops_token ]
            properties:
              ops_token:
                $ref: "../schemas/ops-token.yaml"
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Not a site admin.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "404":
      description: No token with that id.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "409":
      description: Already revoked.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

exchangeOpsToken:
  summary: Exchange an ops token for a short-lived one
  description: >
    Trades the calling token (which needs `ops:exchange`) for a new token that
    expires soon, so a long-lived token can stay in a password manager while
    an agent works with a short-lived copy. The new token gets the requested
    scopes, or all of the caller's; never `ops:exchange`, so it can't mint
    more. It expires after `expires_in_seconds` (default one hour) or when
    the calling token does, whichever is first, and is revoked along with it.
  operationId: exchangeOpsToken
  security:
    - ops-token: [ "ops:exchange" ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            scopes:
              type: array
              minItems: 1
              items:
                type: string
                enum: [ "ops:read", "ops:triage", "ops:alerts-ingest" ]
              description: >
                Scopes for the new token; each must be one the caller holds.
                Defaults to all of the caller's scopes except `ops:exchange`.
            expires_in_seconds:
              type: integer
              minimum: 60
              maximum: 28800
              description: Lifetime, up to 8 hours. Defaults to 3600 (1 hour).
  responses:
    "201":
      description: The new token.
      content:
        application/json:
          schema:
            type: object
            required: [ ops_token, token ]
            properties:
              ops_token:
                $ref: "../schemas/ops-token.yaml"
              token:
                type: string
                description: The secret, `safops_…`. Shown once.
    "400":
      description: >
        Invalid request: a requested scope the caller doesn't hold, or no
        scopes left to grant.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "401":
      description: Missing, invalid, expired, or revoked token.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: The token lacks `ops:exchange`.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "429":
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

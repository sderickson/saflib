type: object
description: >
  Wire form of a queued API-call job; field names match the `job` row and nested JSON.
  Omits internal columns (`heartbeat_at`, `updated_at`). Authority is the discriminated
  evidence grant without the raw enqueue assertion token (detail endpoints may return that
  separately as `authority_assertion`).
properties:
  id:
    type: string
    description: Short identifier for the job (from generateShortId).
    example: "Jb3k_mN7"
  status:
    type: string
    enum:
      - pending
      - running
      - retrying
      - succeeded
      - dead
      - cancelled
    description: >
      Lifecycle state. `pending`/`retrying` are claimable; `running` is in delivery; `succeeded`/`dead`/`cancelled` are terminal.
    example: "pending"
  operation_id:
    type: string
    description: Target OpenAPI operationId resolved at delivery time.
    example: "jobsDemoStepB"
  request:
    type: object
    description: >
      Capped request payload delivered to the target operation (serialized size ≤ 16 KB). Path params, query, and body are optional and substituted into the operation's path template / request.
    additionalProperties: false
    properties:
      path_params:
        type: object
        description: Path template substitutions keyed by parameter name.
        additionalProperties: true
      query:
        type: object
        description: Query string parameters keyed by name.
        additionalProperties: true
      body:
        description: JSON request body for the target operation, when any.
    example:
      body:
        failures_before_success: 2
  user_id:
    type: string
    description: Acting user whose authority the job runs under.
    example: "Us7k_pQ2"
  authority:
    description: >
      Root grant for the job chain (copied verbatim by children). Discriminated on `kind`. Wire form excludes the embedded enqueue assertion token.
    discriminator:
      propertyName: kind
    oneOf:
      - type: object
        description: >
          A user's authenticated request (or an admin action) instigated the chain. Evidence is the originating request id (also in the audit log).
        additionalProperties: false
        required:
          - kind
          - user_id
          - request_id
        properties:
          kind:
            type: string
            enum:
              - request
            example: "request"
          user_id:
            type: string
            description: User who made the originating request.
            example: "Us7k_pQ2"
          request_id:
            type: string
            description: Originating request id (e.g. X-Request-ID).
            example: "r-abc123"
      - type: object
        description: >
          An inbound event was attributed to a product resource (e.g. via webhook endpoint attribution). Evidence is the resource row that authorized the work to react to those events.
        additionalProperties: false
        required:
          - kind
          - user_id
          - resource_id
        properties:
          kind:
            type: string
            enum:
              - resource
            example: "resource"
          user_id:
            type: string
            description: Owner of the resource whose authority is used.
            example: "Us7k_pQ2"
          resource_id:
            type: string
            description: Short id of the resource row that authorized the chain.
            example: "Rs7k_mN2"
      - type: object
        description: >
          A cron tick fired for an enabled job; the admin who last enabled it is the recorded authority. Evidence is the cron job name.
        additionalProperties: false
        required:
          - kind
          - user_id
          - cron_job_name
        properties:
          kind:
            type: string
            enum:
              - cron
            example: "cron"
          user_id:
            type: string
            description: Admin who enabled the cron job (`enabled_by`).
            example: "Us7k_pQ2"
          cron_job_name:
            type: string
            description: Name of the cron job that enqueued this chain.
            example: "recoverySweep"
  original_request_id:
    type: string
    description: >
      Chain-root request id (user request / webhook X-Request-ID, or cron-tick id). Copied from parent on chained enqueues; joins audit_event.request_id.
    example: "r-abc123"
  enqueued_by_operation_id:
    type: string
    description: Calling operationId that enqueued this job (trigger-map edge).
    example: "startJobsDemo"
  parent_job_id:
    type: [string, "null"]
    description: Short id of the job that enqueued this one, or null at the chain root.
    example: null
  run_at:
    type: string
    format: date-time
    description: Earliest time the job may be claimed for delivery.
    example: "2026-08-06T21:00:00.000Z"
  dedupe_key:
    type: [string, "null"]
    description: >
      Optional key unique among non-terminal jobs. Re-enqueue with the same live key upserts (pushes run_at, refreshes request) and returns the existing job.
    example: "matter:demo-1:claim"
  concurrency_key:
    type: [string, "null"]
    description: >
      Optional key limiting concurrency: at most one running job per key (e.g. `matter:{id}`).
    example: "matter:demo-1"
  priority:
    type: integer
    description: Claim priority; higher values are claimed first. Default 0.
    example: 0
  attempt:
    type: integer
    description: Number of delivery attempts consumed so far (0 before first claim).
    example: 0
  max_attempts:
    type: integer
    description: Maximum delivery attempts before the job becomes dead (exhausted).
    example: 5
  result:
    type: [object, "null"]
    description: >
      Outcome of the latest terminal or failed attempt. Null while the job has not yet finished an attempt that records a result. `error_body` is set only on failure and capped at 8 KB.
    additionalProperties: false
    properties:
      status_code:
        type: integer
        description: HTTP status code from the delivery attempt, when available.
        example: 500
      error_body:
        type: [string, "null"]
        description: Capped error response body recorded only on failure.
        example: '{"error":"upstream timeout"}'
      terminal_reason:
        type: [string, "null"]
        enum:
          - exhausted
          - permanent-status
          - rejected-by-endpoint
          - auth-unresolvable
          - cancelled-by-admin
          - cancelled-by-chain
          - null
        description: >
          Why the job became terminal. Null when the job succeeded or result is from a non-terminal retryable failure mid-flight.
        example: "exhausted"
  created_at:
    type: string
    format: date-time
    description: When the job row was created.
    example: "2026-08-06T20:59:55.000Z"
  started_at:
    type: [string, "null"]
    format: date-time
    description: When the current (or last) delivery attempt started; null if never claimed.
    example: null
  finished_at:
    type: [string, "null"]
    format: date-time
    description: When the job reached a terminal status; null while still active.
    example: null
required:
  - id
  - status
  - operation_id
  - request
  - user_id
  - authority
  - original_request_id
  - enqueued_by_operation_id
  - parent_job_id
  - run_at
  - dedupe_key
  - concurrency_key
  - priority
  - attempt
  - max_attempts
  - result
  - created_at
  - started_at
  - finished_at

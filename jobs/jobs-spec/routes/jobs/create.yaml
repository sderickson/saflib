enqueueJob:
  summary: Enqueue a background job
  description: >
    Internal-surface enqueue. Auth is the M1 signed assertion path (not
    site-admin-only). Assertion claims supply `callingOperationId` and
    `originalRequestId`. On a live `dedupeKey` collision the existing job is
    upserted (runAt pushed, request refreshed) and returned with 200; otherwise
    a new job is created with 201.
  operationId: enqueueJob
  tags:
    - jobs

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - operationId
            - request
          properties:
            operationId:
              type: string
              description: Target OpenAPI operationId (must exist and carry the background tag).
              example: "jobsDemoStepB"
            request:
              description: >
                Capped request payload for the target operation (serialized size
                ≤ 16 KB including this object's pathParams/query/body).
              $ref: "../../schemas/job.yaml#/properties/request"
            runAt:
              type: string
              format: date-time
              description: >
                Absolute earliest claim time. Ignored when delayMs is also set if
                the implementation prefers delayMs; typically use one or the other.
              example: "2026-08-06T21:00:00.000Z"
            delayMs:
              type: integer
              minimum: 0
              description: >
                Relative delay in milliseconds from enqueue time before the job
                becomes claimable. Alternative to runAt.
              example: 5000
            dedupeKey:
              type: string
              nullable: true
              description: >
                Optional key unique among non-terminal jobs. Re-enqueue with the
                same live key upserts and returns the existing job (200).
              example: "matter:Mt4k_wZ7:claim"
            concurrencyKey:
              type: string
              nullable: true
              description: >
                Optional key limiting concurrency (at most one running job per key).
              example: "matter:Mt4k_wZ7"
            priority:
              type: integer
              description: Claim priority; higher values are claimed first. Defaults to 0.
              example: 0
            onBehalfOf:
              type: object
              additionalProperties: false
              description: >
                Explicit authority override for enqueueOnBehalfOf. When present,
                both userId and authority evidence are required; the job runs as
                that user under the given grant instead of deriving authority from
                the caller's request context.
              required:
                - userId
                - authority
              properties:
                userId:
                  type: string
                  description: Acting user for the enqueued job.
                  example: "Us7k_pQ2"
                authority:
                  description: Evidence grant for the override (request or importer kind).
                  $ref: "../../schemas/job.yaml#/properties/authority"

  responses:
    "201":
      description: Job created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - job
            properties:
              job:
                $ref: "../../openapi.yaml#/components/schemas/Job"

    "200":
      description: Existing job returned after a dedupe-key upsert.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - job
            properties:
              job:
                $ref: "../../openapi.yaml#/components/schemas/Job"

    "400":
      description: Request payload exceeds the 16 KB serialized size cap.
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

    "401":
      description: Unauthorized - missing or invalid assertion.
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

    "403":
      description: Forbidden - calling operation is not allowed to enqueue the target (trigger-map violation).
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

    "422":
      description: >
        Unknown operationId, or the target operation is not tagged `background`.
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

    "429":
      description: Spawn cap exceeded for this originalRequestId chain.
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

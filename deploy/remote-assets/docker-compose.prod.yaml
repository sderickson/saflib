# Cap each container's Docker log (json-file is unbounded by default and
# lives on the boot disk under /var/lib/docker): 3 x 10 MB, rotated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    image: $CONTAINER_REGISTRY/__organization-name__-caddy:latest
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DISABLE_VITE_DEV_SERVER=#
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # BEGIN WORKFLOW AREA monolith FOR product/init
  __product-name__-monolith:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/__organization-name__-__product-name__-monolith:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    memswap_limit: 2G
    volumes:
      - /opt/__product-name__/cron:/app/__product-name__/service/cron/data
      - /opt/__product-name__/db:/app/__product-name__/service/db/data
      - /opt/__product-name__/identity:/app/__product-name__/service/identity/data
      - /opt/__product-name__/identity-http:/app/saflib/identity/identity-http/data
    build:
      context: ../..
      dockerfile: __product-name__/service/monolith/Dockerfile
    env_file:
      - ./.env.__product-name__.secrets
  # END WORKFLOW AREA

  kratos-migrate:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/__organization-name__-kratos:v26.2.0
    # SQL applied lines flood compose logs; keep output only on failure.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/kratos migrate sql -e --yes > /tmp/kratos-migrate.log 2>&1
        status=$$?
        if [ $$status -ne 0 ]; then
          cat /tmp/kratos-migrate.log >&2
          exit $$status
        fi
        echo "kratos-migrate: ok"
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
      - LOG_LEVEL=warn
    volumes:
      - kratos_home:/home/ory
      - /opt/kratos/data:/var/lib/sqlite

  kratos:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/__organization-name__-kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
    env_file:
      - ./.env.kratos.secrets
    volumes:
      - kratos_home:/home/ory
      - /opt/kratos/data:/var/lib/sqlite
    restart: unless-stopped

  node_exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.12.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"

volumes:
  caddy_data:
    name: __product-name__-prod-caddy-data
  caddy_config:
    name: __product-name__-prod-caddy-config
  kratos_home:
    name: __product-name__-prod-kratos-home

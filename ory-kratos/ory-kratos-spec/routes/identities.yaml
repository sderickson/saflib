lookupIdentitiesAdmin:
  summary: Look up identities by id
  description: >
    Resolves a batch of identity ids to names and emails for display. Ids
    with no identity are left out of the result. Site admins only.
  operationId: lookupIdentitiesAdmin
  security:
    - session: [site-admin]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - ids
          properties:
            ids:
              type: array
              minItems: 1
              maxItems: 200
              items:
                type: string
                minLength: 1
                maxLength: 128
  responses:
    "200":
      description: The identities that exist, in no particular order.
      content:
        application/json:
          schema:
            type: object
            required:
              - identities
            properties:
              identities:
                type: array
                items:
                  $ref: "../schemas/identity-summary.yaml"
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Site admin required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "502":
      description: The identity service could not be reached.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

listIdentitiesAdmin:
  summary: List and search identities
  description: >
    Everyone with an identity, newest first, optionally filtered by a search
    on name, email or id. Site admins only.
  operationId: listIdentitiesAdmin
  security:
    - session: [site-admin]
  parameters:
    - name: q
      in: query
      description: Matches name or email (substring) or id (prefix), case-insensitive.
      schema:
        type: string
        maxLength: 200
    - name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 64
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    "200":
      description: One page of identities.
      content:
        application/json:
          schema:
            type: object
            required:
              - identities
              - next_cursor
              - total
            properties:
              identities:
                type: array
                items:
                  $ref: "../schemas/identity-record.yaml"
              next_cursor:
                type: [ string, "null" ]
              total:
                type: integer
                description: How many identities match the search.
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Site admin required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "502":
      description: The identity service could not be reached.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

getIdentityAdmin:
  summary: Get one identity
  description: One identity with its second factors and active session count. Site admins only.
  operationId: getIdentityAdmin
  security:
    - session: [site-admin]
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
  responses:
    "200":
      description: The identity.
      content:
        application/json:
          schema:
            type: object
            required:
              - identity
              - mfa_methods
              - active_sessions
            properties:
              identity:
                $ref: "../schemas/identity-record.yaml"
              mfa_methods:
                type: array
                description: Second factors set up, e.g. `totp`, `webauthn`, `passkey`.
                items:
                  type: string
              active_sessions:
                type: integer
    "404":
      description: No such identity.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Site admin required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "502":
      description: The identity service could not be reached.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

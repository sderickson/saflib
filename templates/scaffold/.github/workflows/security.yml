# Security regression Playwright suite (product `{product}/security/`).
# Runs against the prod-local compose stack. Exclude @canary (production HTTPS).
name: Security Suite

on:
  pull_request:
    paths:
      - "security/**"
      - "**/caddy*/**"
      - "**/caddy-config/**"
      - "service/http/**"
      - "clients/**"
      - "deploy/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Playwright vs prod-local
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Map prod-local hostnames to loopback
        run: |
          echo "127.0.0.1 docker.localhost api.docker.localhost app.docker.localhost auth.docker.localhost admin.docker.localhost account.docker.localhost kratos.docker.localhost evil.localhost" | sudo tee -a /etc/hosts

      - uses: ./.github/actions/setup-node-deps

      - name: Generate Docker assets
        run: npm exec saf-docker generate

      - name: Build prod images (CI)
        run: npm run build:ci
        working-directory: deploy

      - name: Start prod-local compose
        working-directory: deploy
        run: |
          docker compose -f docker-compose.prod-local.yaml up -d --wait 2>&1 | tee last-docker-compose.log

      - name: Install Playwright browsers
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium
        working-directory: security

      - name: Run Playwright — security suite
        run: npm run test:e2e
        working-directory: security

      - name: Collect Docker Compose logs
        if: failure()
        working-directory: deploy
        run: docker compose -f docker-compose.prod-local.yaml logs --no-color > compose-services.log || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: security-playwright-report
          path: security/playwright-report/
          retention-days: 14

      - name: Stop prod-local stack
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.prod-local.yaml down -v || true

services:
  caddy:
    cap_add:
      - NET_ADMIN
    image: $CONTAINER_REGISTRY/saflib-caddy:latest
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DISABLE_VITE_DEV_SERVER=#
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # BEGIN WORKFLOW AREA monolith FOR product/init
  templates-monolith:
    image: $CONTAINER_REGISTRY/saflib-templates-monolith:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    memswap_limit: 2G
    volumes:
      - /opt/__product-name__/cron:/app/__product-name__/service/cron/data
      - /opt/__product-name__/db:/app/__product-name__/service/db/data
      - /opt/__product-name__/identity:/app/__product-name__/service/identity/data
      - /opt/__product-name__/identity-http:/app/saflib/identity/identity-http/data
    build:
      context: ../..
      dockerfile: __product-name__/service/monolith/Dockerfile
    env_file:
      - ./.env.templates.secrets
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  # END WORKFLOW AREA

  kratos-migrate:
    image: $CONTAINER_REGISTRY/saflib-kratos:v26.2.0
    # SQL applied lines flood compose logs; keep output only on failure.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/kratos migrate sql -e --yes > /tmp/kratos-migrate.log 2>&1
        status=$$?
        if [ $$status -ne 0 ]; then
          cat /tmp/kratos-migrate.log >&2
          exit $$status
        fi
        echo "kratos-migrate: ok"
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
      - LOG_LEVEL=warn
    volumes:
      - /opt/kratos/data:/var/lib/sqlite

  kratos:
    image: $CONTAINER_REGISTRY/saflib-kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    env_file:
      - ./.env.kratos.secrets
    volumes:
      - /opt/kratos/data:/var/lib/sqlite
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.11.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"

  watchtower:
    image: containrrr/watchtower:1.7.1
    command:
      # Poll every 60 seconds so local "push new :latest" tests are fast.
      - "--interval=60"
      # Only update containers explicitly opted-in via the enable label.
      - "--label-enable"
      - "--cleanup"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR auth: assume docker login has written credentials to ~/.docker/config.json on the host.
      - ${HOME}/.docker/config.json:/config.json:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

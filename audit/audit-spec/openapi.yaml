openapi: 3.1.0
info:
  title: Audit Log API
  version: 1.0.0
  description: Hash-chained append-only audit log — admin browse and chain verification.

components:
  securitySchemes:
    session:
      $ref: "pkg:@saflib/openapi/security-schemes/session.yaml"
  schemas:
    AuditLog:
      $ref: "./schemas/audit-log.yaml"
    AuditRotationStatus:
      $ref: "./schemas/audit-rotation-status.yaml"
    AuditSealResult:
      $ref: "./schemas/audit-seal-result.yaml"
    audit-seal-result:
      $ref: "./schemas/audit-seal-result.yaml"
    seal-audit-log-response:
      $ref: "./schemas/seal-audit-log-response.yaml"
    Error:
      $ref: "pkg:@saflib/openapi/schemas/error.yaml"

paths:
  /audit-logs:
    get:
      $ref: "./routes/audit-logs.yaml#/listAuditLogs"
  /audit-logs/seal:
    post:
      $ref: "./routes/audit-logs/seal.yaml#/sealAuditLog"
  /maintenance/seal-audit-log:
    post:
      $ref: "./routes/maintenance/seal-audit-log.yaml#/sealAuditLogMaintenance"
  /maintenance/check-audit-log-rotation:
    post:
      $ref: "./routes/maintenance/check-audit-log-rotation.yaml#/checkAuditLogRotationMaintenance"

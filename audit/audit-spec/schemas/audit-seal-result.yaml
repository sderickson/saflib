# Result of `sealAuditDb`: completed seal with archive metadata, or skip.
type: object
description: >
  Outcome of one audit seal pipeline run. On `sealed`, `archive` carries the
  sealed time range plus chain/upload metadata. On `skipped`, only `status`,
  `reason`, and `duration_ms` are present.
additionalProperties: false
required:
  - status
  - duration_ms
properties:
  status:
    type: string
    enum:
      - sealed
      - skipped
  reason:
    type: string
    enum:
      - empty
      - in_progress
  duration_ms:
    type: integer
    minimum: 0
  archive:
    type: object
    additionalProperties: false
    required:
      - filename
      - size_bytes
      - sha256_hex
      - archive_key
      - row_count
      - head_hash
      - tail_hash
      - first_ts
      - last_ts
    properties:
      filename:
        type: string
      size_bytes:
        type: integer
        minimum: 0
      sha256_hex:
        type: string
        minLength: 64
        maxLength: 64
      archive_key:
        type: string
        description: Remote archive identifier (object path, bucket key, etc.).
      row_count:
        type: integer
        minimum: 1
      head_hash:
        type: string
        minLength: 64
        maxLength: 64
      tail_hash:
        type: string
        minLength: 64
        maxLength: 64
      first_ts:
        type: string
        format: date-time
      last_ts:
        type: string
        format: date-time
      branch_count:
        type: integer
        minimum: 0

type: object
description: One row from the append-only audit log (admin API shape).
required:
  - id
  - ts
  - prevHash
  - rowHash
  - schemaVersion
  - source
  - eventType
  - outcome
  - gitCommitRoot
  - gitCommitSaflib
  - env
properties:
  id:
    type: string
  ts:
    type: string
    format: date-time
  prevHash:
    type: string
  rowHash:
    type: string
  schemaVersion:
    type: integer
  source:
    type: string
    enum:
      - http
      - cron
      - kratos
      - system
      - webhook
  actorUserId:
    type: [ string, "null" ]
  onBehalfOfUserId:
    type: [ string, "null" ]
  authMethod:
    type: [ string, "null" ]
  requestId:
    type: [ string, "null" ]
  clientIp:
    type: [ string, "null" ]
  eventType:
    type: string
  resourceType:
    type: [ string, "null" ]
  resourceId:
    type: [ string, "null" ]
  outcome:
    type: string
  gitCommitRoot:
    type: string
  gitCommitSaflib:
    type: string
  env:
    type: string
  details:
    type: [ object, "null" ]
    description: Event-specific JSON payload; shape depends on `source`.
    additionalProperties: true

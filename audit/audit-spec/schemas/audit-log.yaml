type: object
description: One row from the append-only audit log (admin API shape).
required:
  - id
  - ts
  - prev_hash
  - row_hash
  - schema_version
  - source
  - event_type
  - outcome
  - git_commit_root
  - git_commit_saflib
  - env
properties:
  id:
    type: string
  ts:
    type: string
    format: date-time
  prev_hash:
    type: string
  row_hash:
    type: string
  schema_version:
    type: integer
  source:
    type: string
    enum:
      - http
      - cron
      - kratos
      - system
      - webhook
  actor_user_id:
    type: [ string, "null" ]
  on_behalf_of_user_id:
    type: [ string, "null" ]
  auth_method:
    type: [ string, "null" ]
  request_id:
    type: [ string, "null" ]
  client_ip:
    type: [ string, "null" ]
  event_type:
    type: string
  resource_type:
    type: [ string, "null" ]
  resource_id:
    type: [ string, "null" ]
  outcome:
    type: string
  git_commit_root:
    type: string
  git_commit_saflib:
    type: string
  env:
    type: string
  details:
    type: [ object, "null" ]
    description: Event-specific JSON payload; shape depends on `source`.
    additionalProperties: true

listAuditLogs:
  summary: List audit log events (admin)
  description: >
    Paginated keyset scan of the audit database, ordered by timestamp then id.
    `headAt` / `tailAt` describe the earliest and latest timestamps currently stored.
    Requires an authenticated site admin.
  operationId: listAuditLogs

  tags:
    - site-admin-only
  parameters:
    - name: from
      in: query
      required: false
      description: >
        Only return events with `ts` greater than or equal to this instant (ISO-8601).
      schema:
        type: string
        format: date-time
    - name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous response's `nextCursor`.
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Page size (default 100, max 1000).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    - name: order
      in: query
      required: false
      description: Sort by `ts` then `id`. `desc` returns newest events first (admin UI default).
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    "200":
      description: Audit events for this page plus table timestamp span.
      content:
        application/json:
          schema:
            type: object
            required:
              - auditLogs
              - headAt
              - tailAt
              - nextCursor
              - chainValid
            properties:
              auditLogs:
                type: array
                items:
                  $ref: "../schemas/audit-log.yaml"
              headAt:
                type: string
                format: date-time
                nullable: true
                description: Earliest `ts` in the audit table, if any rows exist.
              tailAt:
                type: string
                format: date-time
                nullable: true
                description: Latest `ts` in the audit table, if any rows exist.
              nextCursor:
                type: string
                nullable: true
                description: Pass as `cursor` to fetch the next page, if more rows exist.
              chainValid:
                type: boolean
                description: Whether the full on-disk hash chain verified successfully.

    "400":
      description: Invalid `from`, `cursor`, or `order`.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

    "401":
      description: Unauthorized - missing or invalid auth headers, or not logged in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

    "403":
      description: Forbidden - admin privileges required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

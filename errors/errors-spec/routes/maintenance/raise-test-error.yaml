raiseTestErrorMaintenance:
  summary: "Intentional error for end-to-end jobs chain probe"
  operationId: "raiseTestErrorMaintenance"
  security:
    - session: [site-admin]
  tags:
    - background
  description: >
    Background maintenance probe: always returns HTTP 500 with
    `X-Jobs-Retry: never` so the job goes `dead` immediately (no retry storm)
    and is visible in the jobs admin UI. Invoked by the `testCronError` cron
    schedule (disabled outside deliberate verification) and manually by site
    admins. Empty body — no client fields.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          description: >
            Empty JSON object. No client fields; the response is unconditional.
          properties: {}
  responses:
    "401":
      description: "Unauthorized - missing or invalid auth headers, or not logged in."
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: "Forbidden - caller is not a site admin."
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "500":
      description: >
        Intentional failure for chain verification. Always includes
        `X-Jobs-Retry: never` so the queue marks the job `dead` without retries.
      headers:
        X-Jobs-Retry:
          required: true
          description: >
            Jobs runtime override. Always `never` for this operation — terminal
            even though the status is 5xx.
          schema:
            type: string
            enum:
              - never
            example: never
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

recordReportedError:
  summary: Record a client-reported error
  operationId: recordReportedError
  x-public: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            reported_error:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - client
                message:
                  type: string
                stack:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                source:
                  type: string
              required:
                - kind
                - message
          required:
            - reported_error
  responses:
    "204":
      description: Error recorded in the server ring buffer.
    "400":
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

postCspViolationReport:
  summary: Ingest a Content-Security-Policy violation report
  description: >
    Accepts a browser CSP violation payload (`application/csp-report` or JSON with a `csp-report` object, or a Reporting API `application/reports+json` batch) and records each violation with the error service and any reported-error sinks (e.g. ops issues) as `kind: csp-violation`, titled by directive, blocked origin and page host; and returns **204**. Tagged `csrf-exempt` because the browser cannot send our double-submit CSRF header on automatic violation posts. Tagged `no-auth` because browsers cannot rely on session cookies on automatic `report-uri` posts (no-cors).
  operationId: postCspViolationReport
  x-public: true
  tags:
    - csrf-exempt
  requestBody:
    required: true
    content:
      application/csp-report:
        schema:
          type: object
          additionalProperties: true
          description: W3C CSP reporting body; typically includes a top-level `csp-report` object.
      application/json:
        schema:
          type: object
          additionalProperties: true
          description: Some user agents send the same JSON as `application/json`.
      application/reports+json:
        schema:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
          description: Reporting API (`report-to`) batch of `{ type, body }` reports.
  responses:
    "204":
      description: Report accepted and stored in the error ring buffer.
    "400":
      description: Malformed body.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

postAdminTestError:
  summary: Admin-only intentional server error
  description: >
    Throws an error on the server for verifying error reporting (e.g. Sentry and the admin Errors page). Requires an authenticated site admin.
  operationId: postAdminTestError
  security:
    - session: [site-admin]
  responses:
    "401":
      description: Unauthorized — missing or invalid auth.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Admin privileges required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "500":
      description: Intentional error for monitoring verification.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

reportClientError:
  summary: Report a browser error (signed-in users)
  description: >
    How client errors reach Issues outside local development: the SPA posts
    uncaught errors and unhandled rejections here. Requires a session, so
    only signed-in users can report; reports are redacted, size-capped and
    grouped like server errors.
  operationId: reportClientError
  security:
    - session: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            reported_error:
              type: object
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                    - client
                message:
                  type: string
                  maxLength: 2000
                stack:
                  type: string
                  maxLength: 8000
                metadata:
                  type: object
                  additionalProperties: true
                source:
                  type: string
                  maxLength: 100
              required:
                - kind
                - message
          required:
            - reported_error
  responses:
    "204":
      description: Recorded.
    "400":
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "401":
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

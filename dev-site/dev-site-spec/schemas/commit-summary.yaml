type: object
description: >
  List-friendly commit row — same metadata as Commit, without the nested
  inventory payloads. Used by GET /commits.
properties:
  hash:
    type: string
    description: Full 40-char commit object hash.
    example: "a1b2c3d4e5f6789012345678901234567890abcd"
  parentHashes:
    type: array
    items:
      type: string
  authoredAt:
    type: string
    format: date-time
  message:
    type: string
    description: Full commit message (subject + body).
  refs:
    type: array
    items:
      $ref: "./commit-ref.yaml"
  analyzerVersion:
    type: string
  computedAt:
    type: string
    format: date-time
  status:
    type: string
    enum: ["pending", "complete", "failed"]
  summaryMetrics:
    type: object
    description: >
      Rollup counts across all packages at this commit, for timeline health
      indicators without fetching CommitDetail.
    properties:
      packageCount:
        type: integer
        minimum: 0
      sourceFiles:
        type: integer
        minimum: 0
      sourceLines:
        type: integer
        minimum: 0
      testFiles:
        type: integer
        minimum: 0
      testLines:
        type: integer
        minimum: 0
      exportCount:
        type: integer
        minimum: 0
      testCaseCount:
        type: integer
        minimum: 0
      issueCountsByKind:
        $ref: "./issue-counts-by-kind.yaml"
      debtCount:
        type: integer
        minimum: 0
        description: >
          Sum of debt kinds only (dead-code + oversized-file + package-layout).
          Excludes same-file-only-export.
      hasIssueStats:
        type: boolean
        description: >
          True when package_issue_stats were computed for this commit (including
          a zero-debt sentinel). False for commits scanned before issue stats.
    required:
      - packageCount
      - sourceFiles
      - sourceLines
      - testFiles
      - testLines
      - exportCount
      - testCaseCount
      - issueCountsByKind
      - debtCount
      - hasIssueStats
required:
  - hash
  - parentHashes
  - authoredAt
  - message
  - refs
  - analyzerVersion
  - computedAt
  - status
  - summaryMetrics

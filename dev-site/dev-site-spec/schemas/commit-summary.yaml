type: object
description: >
  List-friendly commit row — same metadata as Commit, without the nested
  inventory payloads. Used by GET /commits.
properties:
  hash:
    type: string
    description: Full 40-char commit object hash.
    example: "a1b2c3d4e5f6789012345678901234567890abcd"
  parent_hashes:
    type: array
    items:
      type: string
  authored_at:
    type: string
    format: date-time
  message:
    type: string
    description: Full commit message (subject + body).
  refs:
    type: array
    items:
      $ref: "./commit-ref.yaml"
  analyzer_version:
    type: string
  computed_at:
    type: string
    format: date-time
  status:
    type: string
    enum: ["pending", "complete", "failed"]
  summary_metrics:
    type: object
    description: >
      Rollup counts across all packages at this commit, for timeline health
      indicators without fetching CommitDetail.
    properties:
      package_count:
        type: integer
        minimum: 0
      source_files:
        type: integer
        minimum: 0
      source_lines:
        type: integer
        minimum: 0
      test_files:
        type: integer
        minimum: 0
      test_lines:
        type: integer
        minimum: 0
      export_count:
        type: integer
        minimum: 0
      test_case_count:
        type: integer
        minimum: 0
      issue_counts_by_kind:
        $ref: "./issue-counts-by-kind.yaml"
      debt_count:
        type: integer
        minimum: 0
        description: >
          Sum of all issue kinds (dead-code + oversized-file + package-layout).
      has_issue_stats:
        type: boolean
        description: >
          True when package_issue_stats were computed for this commit (including
          a zero-debt sentinel). False for commits scanned before issue stats.
    required:
      - package_count
      - source_files
      - source_lines
      - test_files
      - test_lines
      - export_count
      - test_case_count
      - issue_counts_by_kind
      - debt_count
      - has_issue_stats
required:
  - hash
  - parent_hashes
  - authored_at
  - message
  - refs
  - analyzer_version
  - computed_at
  - status
  - summary_metrics

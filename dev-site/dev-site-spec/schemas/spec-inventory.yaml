type: object
description: >
  OpenAPI inventory for one `-spec` package — business objects (schemas/) and/or
  REST resources (routes/), linked by normalized name stems. Operations include
  triangle links to sibling `-http` handlers and `-sdk` requests when present.
required:
  - entities
properties:
  entities:
    type: array
    description: Flat alphabetical list of object / both / routes entities.
    items:
      type: object
      required:
        - key
        - label
        - presence
        - usedByPackages
        - operations
      properties:
        key:
          type: string
          description: Stable entity key (e.g. both:Matter, routes:admin, object:Error).
        label:
          type: string
          description: Display name — schema component name when present, else resource folder.
        presence:
          type: string
          enum:
            - object
            - routes
            - both
          description: >
            object = schema only; routes = REST resource only; both = schema + matching resource.
        resource:
          type: string
          nullable: true
          description: routes/<resource> folder name when present.
        schema:
          type: object
          nullable: true
          required:
            - name
            - yamlPath
            - properties
            - usedBy
            - referencedByOperations
          properties:
            name:
              type: string
              description: components/schemas name (e.g. Matter).
            yamlPath:
              type: string
              description: Package-relative path to the schema YAML.
            description:
              type: string
              nullable: true
            properties:
              type: array
              items:
                type: object
                required:
                  - name
                  - typeKind
                properties:
                  name:
                    type: string
                  typeKind:
                    type: string
                  docstring:
                    type: string
                    nullable: true
            usedBy:
              type: array
              description: Non-test product files importing schemas/<Name>.
              items:
                $ref: "#/properties/entities/items/properties/operations/items/properties/usedBy/items"
            referencedByOperations:
              type: array
              description: operationIds whose request/2xx response $ref this schema.
              items:
                type: string
        usedByPackages:
          type: array
          description: >
            Distinct packages importing this entity's schema and/or the SDK
            request modules for its operations.
          items:
            type: string
        operations:
          type: array
          description: REST operations under the linked resource (empty for object-only).
          items:
            type: object
            required:
              - operationId
              - method
              - path
              - tags
              - yamlPath
              - requestSchemas
              - responseSchemas
              - handlerTests
              - usedBy
            properties:
              operationId:
                type: string
              method:
                type: string
              path:
                type: string
              summary:
                type: string
                nullable: true
              tags:
                type: array
                description: OpenAPI operation tags.
                items:
                  type: string
              yamlPath:
                type: string
                description: Package-relative route YAML under the spec package.
              routeStem:
                type: string
                nullable: true
                description: >
                  Isomorphic stem after routes/handlers/requests
                  (e.g. matters/core/create).
              handler:
                type: object
                nullable: true
                description: Sibling HTTP handler file when present.
                required:
                  - filePath
                  - repoPath
                properties:
                  filePath:
                    type: string
                  repoPath:
                    type: string
              request:
                type: object
                nullable: true
                description: Sibling SDK request module when present.
                required:
                  - filePath
                  - repoPath
                properties:
                  filePath:
                    type: string
                  repoPath:
                    type: string
              handlerTests:
                type: array
                description: >
                  describe/it/test specifications extracted from colocated HTTP
                  handler test files (fullName uses " > " nesting).
                items:
                  type: object
                  required:
                    - fullName
                  properties:
                    fullName:
                      type: string
                      description: Nested describe/it titles joined with " > ".
                      example: "createMatter > creates a matter for the org"
              requestSchemas:
                type: array
                description: >
                  Business objects in the request body (one layer deep into
                  object/array bags of schema refs).
                items:
                  type: string
              responseSchemas:
                type: array
                description: >
                  Business objects in 2xx responses (one layer deep into
                  object/array bags of schema refs).
                items:
                  type: string
              usedBy:
                type: array
                description: >
                  Non-test product files importing the sibling SDK request
                  module for this route stem.
                items:
                  type: object
                  required:
                    - packageName
                    - filePath
                    - repoPath
                  properties:
                    packageName:
                      type: string
                    filePath:
                      type: string
                      description: Path within the importing package (no package-root prefix).
                    repoPath:
                      type: string
                      description: Repo-relative path for source links.

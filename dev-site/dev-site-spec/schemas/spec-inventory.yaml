type: object
description: >
  OpenAPI inventory for one spec package — business objects (schemas/) and/or REST resources (routes/), linked by normalized name stems. Operations include links to HTTP handlers and SDK requests from packages that depend on this spec. Also attached to http package detail for the HTTP Spec pane.
required:
  - entities
properties:
  package_directory:
    type: string
    description: >
      Repo-relative directory of the spec package this inventory was built from (used for route YAML source links when shown from an http pane).
  entities:
    type: array
    description: Flat alphabetical list of object / both / routes entities.
    items:
      type: object
      required:
        - key
        - label
        - presence
        - used_by_packages
        - operations
      properties:
        key:
          type: string
          description: Stable entity key (e.g. both:Matter, routes:admin, object:Error).
        label:
          type: string
          description: Display name — schema component name when present, else resource folder.
        presence:
          type: string
          enum:
            - object
            - routes
            - both
          description: >
            object = schema only; routes = REST resource only; both = schema + matching resource.
        resource:
          type: [ string, "null" ]
          description: routes/<resource> folder name when present.
        schema:
          type: [ object, "null" ]
          required:
            - name
            - yaml_path
            - properties
            - used_by
            - referenced_by_operations
          properties:
            name:
              type: string
              description: components/schemas name (e.g. Matter).
            yaml_path:
              type: string
              description: Package-relative path to the schema YAML.
            description:
              type: [ string, "null" ]
            properties:
              type: array
              items:
                type: object
                required:
                  - name
                  - type_kind
                properties:
                  name:
                    type: string
                  type_kind:
                    type: string
                  docstring:
                    type: [ string, "null" ]
            used_by:
              type: array
              description: Non-test product files importing schemas/<Name>.
              items:
                $ref: "#/properties/entities/items/properties/operations/items/properties/used_by/items"
            referenced_by_operations:
              type: array
              description: operation_ids whose request/2xx response $ref this schema.
              items:
                type: string
        used_by_packages:
          type: array
          description: >
            Distinct packages importing this entity's schema and/or the SDK request modules for its operations.
          items:
            type: string
        operations:
          type: array
          description: REST operations under the linked resource (empty for object-only).
          items:
            type: object
            required:
              - operation_id
              - method
              - path
              - tags
              - yaml_path
              - request_schemas
              - response_schemas
              - handler_tests
              - used_by
            properties:
              operation_id:
                type: string
              method:
                type: string
              path:
                type: string
              summary:
                type: [ string, "null" ]
              tags:
                type: array
                description: OpenAPI operation tags.
                items:
                  type: string
              yaml_path:
                type: string
                description: Package-relative route YAML under the spec package.
              route_stem:
                type: [ string, "null" ]
                description: >
                  Isomorphic stem after routes/handlers/requests (e.g. matters/core/create).
              handler:
                type: [ object, "null" ]
                description: Sibling HTTP handler file when present.
                required:
                  - file_path
                  - repo_path
                properties:
                  file_path:
                    type: string
                  repo_path:
                    type: string
              request:
                type: [ object, "null" ]
                description: Sibling SDK request module when present.
                required:
                  - file_path
                  - repo_path
                properties:
                  file_path:
                    type: string
                  repo_path:
                    type: string
              fake:
                type: [ object, "null" ]
                description: >
                  Sibling SDK fake/MSW module (`*.fake.ts`) when present beside the request.
                required:
                  - file_path
                  - repo_path
                properties:
                  file_path:
                    type: string
                  repo_path:
                    type: string
              handler_tests:
                type: array
                description: >
                  describe/it/test specifications extracted from colocated HTTP handler test files (full_name uses " > " nesting).
                items:
                  type: object
                  required:
                    - full_name
                  properties:
                    full_name:
                      type: string
                      description: Nested describe/it titles joined with " > ".
                      example: "createMatter > creates a matter for the org"
              request_schemas:
                type: array
                description: >
                  Business objects in the request body (one layer deep into object/array bags of schema refs).
                items:
                  type: string
              response_schemas:
                type: array
                description: >
                  Business objects in 2xx responses (one layer deep into object/array bags of schema refs).
                items:
                  type: string
              used_by:
                type: array
                description: >
                  Non-test product files importing the sibling SDK request module for this route stem.
                items:
                  type: object
                  required:
                    - package_name
                    - file_path
                    - repo_path
                  properties:
                    package_name:
                      type: string
                    file_path:
                      type: string
                      description: Path within the importing package (no package-root prefix).
                    repo_path:
                      type: string
                      description: Repo-relative path for source links.
              enqueues:
                type: array
                description: >
                  operation_ids this op may enqueue (product job trigger map). Present only when the HTTP app was configured with a map.
                items:
                  type: string
              enqueued_by:
                type: array
                description: >
                  operation_ids or `cron:…` keys that may enqueue this op. Present only when the HTTP app was configured with a map.
                items:
                  type: string

type: object
description: >
  Delta between two analyzed commits. Exports and test cases are identity-based
  (add/remove only — a rename shows up as remove + add). Package metrics include
  a `changed` list when the same package_name exists on both sides with different
  counts.
properties:
  from_hash:
    type: string
    description: Baseline commit hash (the "before").
  to_hash:
    type: string
    description: Comparison commit hash (the "after").
  package_metrics:
    type: object
    properties:
      added:
        type: array
        items:
          $ref: "./package-metrics.yaml"
      removed:
        type: array
        items:
          $ref: "./package-metrics.yaml"
      changed:
        type: array
        items:
          type: object
          properties:
            before:
              $ref: "./package-metrics.yaml"
            after:
              $ref: "./package-metrics.yaml"
          required:
            - before
            - after
    required:
      - added
      - removed
      - changed
  exports:
    type: object
    properties:
      added:
        type: array
        items:
          $ref: "./export-entry.yaml"
      removed:
        type: array
        items:
          $ref: "./export-entry.yaml"
    required:
      - added
      - removed
  test_cases:
    type: object
    properties:
      added:
        type: array
        items:
          $ref: "./test-case.yaml"
      removed:
        type: array
        items:
          $ref: "./test-case.yaml"
    required:
      - added
      - removed
  db_schemas:
    type: object
    description: Structural drizzle table/column deltas across both commits.
    properties:
      tables:
        type: object
        required:
          - added
          - removed
        properties:
          added:
            type: array
            items:
              $ref: "./db-schema-table.yaml"
          removed:
            type: array
            items:
              $ref: "./db-schema-table.yaml"
      columns:
        type: object
        required:
          - added
          - removed
          - changed
        properties:
          added:
            type: array
            items:
              $ref: "./db-schema-column.yaml"
          removed:
            type: array
            items:
              $ref: "./db-schema-column.yaml"
          changed:
            type: array
            items:
              type: object
              required:
                - before
                - after
              properties:
                before:
                  $ref: "./db-schema-column.yaml"
                after:
                  $ref: "./db-schema-column.yaml"
    required:
      - tables
      - columns
required:
  - from_hash
  - to_hash
  - package_metrics
  - exports
  - test_cases
  - db_schemas

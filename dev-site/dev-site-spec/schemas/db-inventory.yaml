type: object
description: Drizzle table inventory for one db package (schemas + query dirs).
required:
  - entities
properties:
  entities:
    type: array
    items:
      type: object
      required:
        - entity
        - used_by_packages
        - queries
      properties:
        entity:
          type: string
          description: Query directory name or kebab form of table name (e.g. package-metrics).
        table:
          type: [ object, "null" ]
          required:
            - export_name
            - table_name
            - columns
            - file_path
          properties:
            export_name:
              type: string
            table_name:
              type: string
            file_path:
              type: string
            docstring:
              type: [ string, "null" ]
              description: First prose line of leading JSDoc on the table const.
            columns:
              type: array
              items:
                type: object
                required:
                  - prop_name
                  - sql_name
                  - type_kind
                properties:
                  prop_name:
                    type: string
                  sql_name:
                    type: string
                  type_kind:
                    type: string
                  docstring:
                    type: [ string, "null" ]
                    description: First prose line of leading JSDoc on the column.
        used_by_packages:
          type: array
          description: Distinct packages (non-test) that import any query under this entity.
          items:
            type: string
        queries:
          type: array
          description: Leaf query modules under queries/<entity>/ (excluding index and tests).
          items:
            type: object
            required:
              - file_name
              - file_path
              - used_by
            properties:
              file_name:
                type: string
              file_path:
                type: string
              export_name:
                type: [ string, "null" ]
              signature:
                type: [ string, "null" ]
              docstring:
                type: [ string, "null" ]
              used_by:
                type: array
                description: Non-test product files that import this leaf query module.
                items:
                  type: object
                  required:
                    - package_name
                    - file_path
                    - repo_path
                  properties:
                    package_name:
                      type: string
                    file_path:
                      type: string
                      description: Path within the importing package (no package-root prefix).
                    repo_path:
                      type: string
                      description: Repo-relative path for source links.

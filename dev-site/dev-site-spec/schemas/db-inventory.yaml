type: object
description: Drizzle table inventory for one db package (schemas + query dirs).
required:
  - entities
properties:
  entities:
    type: array
    items:
      type: object
      required:
        - entity
        - usedBy
      properties:
        entity:
          type: string
          description: Query directory name or kebab form of table name (e.g. package-metrics).
        table:
          type: object
          nullable: true
          required:
            - exportName
            - tableName
            - columns
            - filePath
          properties:
            exportName:
              type: string
            tableName:
              type: string
            filePath:
              type: string
            docstring:
              type: string
              nullable: true
              description: First prose line of leading JSDoc on the table const.
            columns:
              type: array
              items:
                type: object
                required:
                  - propName
                  - sqlName
                  - typeKind
                properties:
                  propName:
                    type: string
                  sqlName:
                    type: string
                  typeKind:
                    type: string
                  docstring:
                    type: string
                    nullable: true
                    description: First prose line of leading JSDoc on the column.
        usedBy:
          type: array
          description: Non-test product files that import queries under this entity.
          items:
            type: object
            required:
              - packageName
              - filePath
            properties:
              packageName:
                type: string
              filePath:
                type: string

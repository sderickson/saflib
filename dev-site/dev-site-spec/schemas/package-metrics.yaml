type: object
description: Per-package file/LOC inventory at a single commit.
properties:
  package_name:
    type: string
    description: npm package name (e.g. `@saflib/git`).
    example: "@saflib/git"
  directory:
    type: string
    description: Package directory relative to the analyzed product root.
    example: "saflib/git"
  kind:
    type: string
    description: >
      Package layer kind. From package.json saf.kind when set, otherwise
      inferred from a unique identifier dependency such as @saflib/drizzle
      (db), @saflib/express (http), @saflib/openapi (spec), @saflib/sdk
      (sdk), or @saflib/vue (spa).
    enum:
      - db
      - http
      - spec
      - spa
      - sdk
      - lib
      - integration
      - other
  source_files:
    type: integer
    minimum: 0
    description: Count of source files (excluding tests).
  source_lines:
    type: integer
    minimum: 0
    description: Total lines across source files.
  prod_lines:
    type: integer
    minimum: 0
    description: Production (non-test) source lines.
  test_lines:
    type: integer
    minimum: 0
    description: Test file lines.
  test_files:
    type: integer
    minimum: 0
    description: Count of test files.
  issue_counts_by_kind:
    $ref: "./issue-counts-by-kind.yaml"
  debt_count:
    type: integer
    minimum: 0
    description: >
      Sum of all issue kinds (dead-code + oversized-file + package-layout).
required:
  - package_name
  - directory
  - source_files
  - source_lines
  - prod_lines
  - test_lines
  - test_files
  - issue_counts_by_kind
  - debt_count

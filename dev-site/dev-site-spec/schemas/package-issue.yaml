type: object
required:
  - kind
  - title
  - name
  - kind_label
  - file_path
  - repo_path
properties:
  kind:
    type: string
    enum:
      - dead-code
      - oversized-file
      - package-layout
  title:
    type: string
  name:
    type: string
  kind_label:
    type: string
  file_path:
    type: string
    description: Package-local path for display
  repo_path:
    type: string
    description: Repo-relative path for open-source links

type: object
description: >
  Full static-analysis snapshot for one commit — metadata plus per-package
  metrics, exports, and test cases.
properties:
  commit:
    $ref: "./commit.yaml"
  package_metrics:
    type: array
    items:
      $ref: "./package-metrics.yaml"
  exports:
    type: array
    items:
      $ref: "./export-entry.yaml"
  test_cases:
    type: array
    items:
      $ref: "./test-case.yaml"
required:
  - commit
  - package_metrics
  - exports
  - test_cases

type: object
description: >
  One step a workflow-run preview walked past — either applied (its file
  content folded into the preview's synthetic commit) or skipped, when its
  kind (`prompt`/`command`/`npm-script`/`update`, or anything else that
  isn't mechanical) genuinely needs a real run.
properties:
  workflow_id:
    type: string
    description: >
      The root workflow's id, or a nested `call-workflow` target's id —
      lets the UI say *which* workflow a given step belongs to.
    example: "drizzle/add-query"
  step_index:
    type: integer
    description: Index within that workflow's own step list.
  kind:
    type: string
    description: The step's kind (e.g. `copy`, `transform-file`, `cd`, `command`, `call-workflow`).
    example: "copy"
  applied:
    type: boolean
    description: Whether this step's effect is reflected in the preview's diff.
  reason:
    type: string
    description: Why a step wasn't applied — its kind isn't previewable, or it threw while trying.
    example: "needs a real run"
required:
  - workflow_id
  - step_index
  - kind
  - applied

type: object
description: >
  Per-kind issue counts for a commit or package. Debt excludes
  same-file-only-export (co-location signal, not structural debt).
properties:
  dead-code:
    type: integer
    minimum: 0
  same-file-only-export:
    type: integer
    minimum: 0
  oversized-file:
    type: integer
    minimum: 0
  package-layout:
    type: integer
    minimum: 0
required:
  - dead-code
  - same-file-only-export
  - oversized-file
  - package-layout

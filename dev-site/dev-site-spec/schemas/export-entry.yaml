type: object
description: One exported symbol extracted from a source file at a commit.
properties:
  packageName:
    type: string
    description: npm package that owns this file.
    example: "@saflib/git"
  filePath:
    type: string
    description: Path relative to the repo root.
    example: "saflib/git/log.ts"
  name:
    type: string
    description: Exported symbol name.
    example: "log"
  kind:
    type: string
    description: Declaration kind (mirrors `@saflib/parser`'s ExportKind).
    enum:
      - function
      - class
      - interface
      - type
      - const
      - enum
      - variable
      - component
      - prop
      - emit
      - model
  signature:
    type: [ string, "null" ]
    description: >
      Syntactic display signature from the AST (no type-checker). Null for re-exports without a local declaration.
    example: "(repoRoot: string, options?: LogOptions)"
  docstring:
    type: [ string, "null" ]
    description: >
      First prose line of the leading JSDoc on the export declaration. Null when absent or for bare re-exports (`export { a }`).
    example: "Walk commits newest-first without checking out."
  usedBy:
    type: array
    description: >
      Non-test product files that import this export (named import match, or whole-module import when names are `*` / default / empty).
    items:
      type: object
      required:
        - packageName
        - filePath
        - repoPath
      properties:
        packageName:
          type: string
        filePath:
          type: string
          description: Path within the importing package (no package-root prefix).
        repoPath:
          type: string
          description: Repo-relative path for source links.
required:
  - packageName
  - filePath
  - name
  - kind
  - signature
  - docstring

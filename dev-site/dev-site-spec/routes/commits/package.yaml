getCommitPackage:
  summary: Package-scoped symbols for one analyzed commit
  operationId: getCommitPackage
  tags:
    - no-auth
  description: >
    Returns metrics, exports, and test cases for a single package at a commit.
    Prefer this over full commit detail for the checkout Spec panel — assembly
    only touches that package's source blobs. For db packages, also includes
    db_inventory (drizzle tables + query dirs). For spec packages, also
    includes spec_inventory (OpenAPI schemas + REST resources). For http and
    sdk packages, spec_inventory is joined from a spec package this package
    depends on, while exports/tests remain this package's own source modules.
    For spa packages, spec_inventory is joined through SDK request imports so
    Spec can show loader routes on a component bundle. layout_issues are live
    working-tree layout/LoC findings for the package directory (cheap;
    package-local). Full dead-code workdir scans stay on
    saf-dev-site issues --workdir — not on this Spec package load.
  parameters:
    - name: hash
      in: path
      required: true
      schema:
        type: string
    - name: package_name
      in: path
      required: true
      schema:
        type: string
      description: npm package name (URL-encoded), e.g. `%40example%2Fbilling-http`
  responses:
    "200":
      description: Package detail at commit
      content:
        application/json:
          schema:
            type: object
            required:
              - package_detail
            properties:
              package_detail:
                type: object
                required:
                  - commit_hash
                  - package_name
                  - directory
                  - source_files
                  - source_lines
                  - prod_lines
                  - test_lines
                  - test_files
                  - exports
                  - test_cases
                properties:
                  commit_hash:
                    type: string
                  package_name:
                    type: string
                  directory:
                    type: string
                  source_files:
                    type: integer
                  source_lines:
                    type: integer
                  prod_lines:
                    type: integer
                  test_lines:
                    type: integer
                  test_files:
                    type: integer
                  exports:
                    type: array
                    items:
                      $ref: "../../schemas/export-entry.yaml"
                  test_cases:
                    type: array
                    items:
                      $ref: "../../schemas/test-case.yaml"
                  db_inventory:
                    $ref: "../../schemas/db-inventory.yaml"
                  spec_inventory:
                    $ref: "../../schemas/spec-inventory.yaml"
                  layout_issues:
                    type: array
                    description: >
                      Working-tree package-layout and oversized-file findings
                      (package-local; cheap). Dead-code workdir scans are CLI-only.
                    items:
                      $ref: "../../schemas/package-issue.yaml"
                  public_export_file_paths:
                    type: array
                    description: >
                      Repo-relative files from live package.json `exports`
                      (SPA main.ts, test-app.ts). Spec Issues skips these for
                      dead-code so the panel matches `saf-dev-site issues --workdir`.
                    items:
                      type: string
    "404":
      description: Commit or package not found
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "500":
      description: Git command failed
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

getCommitPackage:
  summary: Package-scoped symbols for one analyzed commit
  operationId: getCommitPackage
  tags:
    - no-auth
  description: >
    Returns metrics, exports, and test cases for a single package at a commit.
    Prefer this over full commit detail for the checkout Spec panel — assembly
    only touches that package's source blobs. For db packages, also includes
    `dbInventory` (drizzle tables + query dirs). For `-spec` packages, also
    includes `specInventory` (OpenAPI schemas + REST resources). For `-http`
    packages, `specInventory` is the sibling `-spec` triangle join (route cards)
    while exports/tests remain the HTTP package's own source modules.
    `workdirIssues` (and layout-only `layoutIssues`) are live working-tree
    findings — same source as `saf-dev-site issues --workdir`, not commit blobs.
  parameters:
    - name: hash
      in: path
      required: true
      schema:
        type: string
    - name: packageName
      in: path
      required: true
      schema:
        type: string
      description: npm package name (URL-encoded), e.g. `%40example%2Fbilling-http`
  responses:
    "200":
      description: Package detail at commit
      content:
        application/json:
          schema:
            type: object
            required:
              - packageDetail
            properties:
              packageDetail:
                type: object
                required:
                  - commitHash
                  - packageName
                  - directory
                  - sourceFiles
                  - sourceLines
                  - prodLines
                  - testLines
                  - testFiles
                  - exports
                  - testCases
                properties:
                  commitHash:
                    type: string
                  packageName:
                    type: string
                  directory:
                    type: string
                  sourceFiles:
                    type: integer
                  sourceLines:
                    type: integer
                  prodLines:
                    type: integer
                  testLines:
                    type: integer
                  testFiles:
                    type: integer
                  exports:
                    type: array
                    items:
                      $ref: "../../schemas/export-entry.yaml"
                  testCases:
                    type: array
                    items:
                      $ref: "../../schemas/test-case.yaml"
                  dbInventory:
                    $ref: "../../schemas/db-inventory.yaml"
                  specInventory:
                    $ref: "../../schemas/spec-inventory.yaml"
                  workdirIssues:
                    type: array
                    description: >
                      Full working-tree package issues (dead code + layout/LoC).
                      Same list as `saf-dev-site issues --workdir`. Prefer this
                      for the checkout Issues tab.
                    items:
                      $ref: "../../schemas/package-issue.yaml"
                  layoutIssues:
                    type: array
                    description: >
                      Working-tree package-layout and oversized-file findings
                      (subset of `workdirIssues`).
                    items:
                      $ref: "../../schemas/package-issue.yaml"
    "404":
      description: Commit or package not found
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
    "500":
      description: Git command failed
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

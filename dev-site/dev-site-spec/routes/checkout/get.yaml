getCheckout:
  summary: Current checkout (HEAD) analysis status
  operationId: getCheckout
  tags:
    - no-auth
  description: >
    Resolve git HEAD and report whether that commit has been analyzed, plus
    package metrics when it has. Used by the Current checkout UI.
  responses:
    "200":
      description: Checkout status
      content:
        application/json:
          schema:
            type: object
            required:
              - hash
              - message
              - authoredAt
              - analyzed
              - packages
            properties:
              hash:
                type: string
              message:
                type: string
              authoredAt:
                type: string
                format: date-time
              analyzed:
                type: boolean
              packages:
                type: array
                items:
                  type: object
                  required:
                    - packageName
                    - directory
                    - sourceFiles
                    - sourceLines
                    - prodLines
                    - testLines
                    - testFiles
                  properties:
                    packageName:
                      type: string
                    directory:
                      type: string
                    sourceFiles:
                      type: integer
                    sourceLines:
                      type: integer
                    prodLines:
                      type: integer
                    testLines:
                      type: integer
                    testFiles:
                      type: integer
    "500":
      description: Git command failed
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

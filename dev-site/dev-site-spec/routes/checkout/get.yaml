getCheckout:
  summary: Current checkout (HEAD) analysis status
  operationId: getCheckout
  tags:
    - no-auth
  description: >
    Resolve git HEAD and report whether that commit has been analyzed, plus package metrics when it has. Also reports local branch compare candidates and the fork-point (merge-base) of HEAD vs `compare_ref` (default `main`). Used by the Current checkout UI.
  parameters:
    - name: compare_ref
      in: query
      required: false
      schema:
        type: string
      description: >
        Local branch name to take the merge-base against. Defaults to the server `main` ref.
  responses:
    "200":
      description: Checkout status
      content:
        application/json:
          schema:
            type: object
            required:
              - hash
              - message
              - authored_at
              - analyzed
              - product_root
              - branch
              - packages
              - compare_candidates
            properties:
              hash:
                type: string
              message:
                type: string
              authored_at:
                type: string
                format: date-time
              analyzed:
                type: boolean
              product_root:
                type: string
                description: >
                  Analysis path prefix within the repo (e.g. `products`). Empty string means the whole repository. Package `directory` values are relative to this prefix; prepend it for repo-absolute paths.
              branch:
                type: [ string, "null" ]
                description: Short branch name for HEAD, or null when detached.
              packages:
                type: array
                items:
                  $ref: "../../schemas/package-metrics.yaml"
              compare_candidates:
                type: array
                description: >
                  Local branch names that can be used as `compare_ref` (current branch omitted; configured main ref always included when it exists).
                items:
                  type: string
              github_repo:
                type: string
                description: >
                  GitHub `owner/name` for source and commit links. Omitted when the server has no `DEV_SITE_GITHUB_REPO` configured.
              compare:
                $ref: "../../schemas/checkout-compare.yaml"
    "400":
      description: compare_ref is not a valid git object.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "500":
      description: Git command failed
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

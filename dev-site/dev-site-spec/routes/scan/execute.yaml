executeScan:
  summary: Queue a scan
  operationId: executeScan
  x-public: true
  description: >
    Queue a background job that analyzes commits and stores static-analysis
    snapshots: either one commit (`commit_hash`) or the newest unanalyzed
    mainline commits (`limit`). Returns the job immediately; poll
    `GET /api/scan/jobs` for progress. A request matching a job that is
    already queued or running returns that job.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          description: >
            Scan options. Empty object is fine; `limit` caps how many new
            mainline commits are analyzed in this job (feature-branch tips are
            skipped when limit is set).
          properties:
            limit:
              type: integer
              minimum: 1
              default: 1
              description: >
                Max new mainline commits to analyze in this job (default 1).
                Feature-branch tips are skipped when limit is set.
                Ignored when `commit_hash` is set.
            commit_hash:
              type: string
              description: >
                Analyze exactly this commit (if not already stored). Used by
                Current checkout "Scan this commit".
  responses:
    "202":
      description: The queued (or already active) scan job.
      content:
        application/json:
          schema:
            type: object
            required:
              - scan_job
            properties:
              scan_job:
                $ref: "../../schemas/scan-job.yaml"

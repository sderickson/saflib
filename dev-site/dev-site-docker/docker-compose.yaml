# Standalone dev-site smoke (built image). Set DEV_SITE_REPO_ROOT and DEV_SITE_PRODUCT_ROOT.
services:
  site:
    image: saflib-dev-site:latest
    build:
      context: ../..
      dockerfile: dev-site/dev-site-docker/Dockerfile
    ports:
      - "3099:3099"
    # env.dev is checked in with "mock" defaults (@saflib/secret-store
    # convention); ./.env is gitignored and, if present, layers real
    # values on top — e.g. ANTHROPIC_API_KEY / CURSOR_API_KEY for
    # "run"-mode workflows (see new-workflows/lib/secrets.json).
    env_file:
      - ./env.dev
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      TZ: UTC
      DEPLOYMENT_NAME: development
      DOMAIN: localhost
      PROTOCOL: http
      CLIENT_SUBDOMAINS: ""
      ADMIN_EMAILS: "admin@saflib.com"
      ALLOW_DB_CREATION: "true"
      DEV_SITE_SERVICE_HTTP_HOST: "0.0.0.0:3099"
      DEV_SITE_REPO_ROOT: /repo
      DEV_SITE_PRODUCT_ROOT: base
      DEV_SITE_MAIN_REF: main
      DEV_SITE_DB_PATH: /data/dev-site.sqlite
    volumes:
      - ../..:/repo:ro
      - ./service/http/data:/data

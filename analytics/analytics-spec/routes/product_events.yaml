recordProductEvent:
  summary: Record a product analytics event
  operationId: recordProductEvent
  tags:
    - product-events
    - no-auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            productEvent:
              type: object
              additionalProperties: true
              properties:
                event:
                  type: string
                client:
                  type: string
                view:
                  type: string
                component:
                  type: string
                context:
                  type: object
                  additionalProperties: true
              required:
                - event
          required:
            - productEvent
  responses:
    "204":
      description: Event recorded in the server ring buffer.
    "400":
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

listProductEvents:
  summary: List buffered product events
  operationId: listProductEvents
  tags:
    - product-events
    - site-admin-only
  parameters:
    - name: name
      in: query
      schema:
        type: string
      description: Filter by event name.
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
      description: Maximum number of entries to return (from the tail).
  responses:
    "200":
      description: Buffered product events, newest last within the filtered slice.
      content:
        application/json:
          schema:
            type: object
            properties:
              productEvents:
                type: array
                items:
                  $ref: "../schemas/product-event-record.yaml"
            required:
              - productEvents
    "401":
      description: Unauthorized - Invalid or missing authentication.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"
    "403":
      description: Forbidden - site admin required.
      content:
        application/json:
          schema:
            $ref: "pkg:@saflib/openapi/schemas/error.yaml"

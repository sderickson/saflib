type: object
description: >
  Product-owned preferences for the signed-in user (owner-only). Keyed by Kratos
  identity id. Holds display name, marketing email consent, and Terms of Service
  agreement — not auth traits. Kratos owns identity/credentials/sessions;
  this resource is the Kratos-minimal product DB pattern.
properties:
  userId:
    type: string
    description: Kratos identity id of the owning user.
    example: "user_abc123"
  displayName:
    type: string
    description: >
      How the user appears to themselves and to others. May be empty after
      lazy-create until the first save; PUT requires a non-empty trimmed value.
    example: "Alex Rivera"
  marketingEmailsOptIn:
    type: boolean
    description: >
      Explicit consent for product/marketing email. Defaults to false until the user
      opts in.
    example: false
  marketingEmailsOptInAt:
    type: string
    format: date-time
    nullable: true
    description: >
      When the user most recently opted into marketing email. Null when never opted
      in or after opting out (cleared when `marketingEmailsOptIn` becomes false).
    example: null
  termsOfServiceAgreedAt:
    type: string
    format: date-time
    nullable: true
    description: >
      When the user agreed to the Terms of Service. Null until agreement is
      recorded (typically via PUT with `termsOfServiceAgreedAt: "now"`). Once set,
      later preference updates do not clear or overwrite it.
    example: null
  createdAt:
    type: string
    format: date-time
    description: When the user config row was created.
    example: "2026-07-23T00:00:00Z"
  updatedAt:
    type: string
    format: date-time
    description: When the user config row was last updated.
    example: "2026-07-23T12:30:00Z"
required:
  - userId
  - displayName
  - marketingEmailsOptIn
  - marketingEmailsOptInAt
  - termsOfServiceAgreedAt
  - createdAt
  - updatedAt
example:
  userId: "user_abc123"
  displayName: "Alex Rivera"
  marketingEmailsOptIn: false
  marketingEmailsOptInAt: null
  termsOfServiceAgreedAt: null
  createdAt: "2026-07-23T00:00:00Z"
  updatedAt: "2026-07-23T12:30:00Z"

type: object
description: >
  Ory Kratos identity as returned by the admin API. Extra fields from Kratos are allowed.
  `id` is the Kratos identity UUID (not a product `generateShortId`).
additionalProperties: true
properties:
  id:
    type: string
    format: uuid
    description: Kratos identity id.
  schema_id:
    type: string
  traits:
    type: object
    additionalProperties: true
  state:
    type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id

services:
  site:
    image: saflib-base-dev-site:latest
    build:
      context: ../..
      dockerfile: base/dev-site/Dockerfile
    ports:
      - "3099:3099"
    environment:
      NODE_ENV: production
      TZ: UTC
      DEPLOYMENT_NAME: development
      DOMAIN: localhost
      PROTOCOL: http
      CLIENT_SUBDOMAINS: ""
      ADMIN_EMAILS: "admin@saflib.com"
      ALLOW_DB_CREATION: "true"
      DEV_SITE_SERVICE_HTTP_HOST: "0.0.0.0:3099"
      DEV_SITE_REPO_ROOT: /repo
      DEV_SITE_PRODUCT_ROOT: base
      DEV_SITE_MAIN_REF: main
      DEV_SITE_DB_PATH: /data/dev-site.sqlite
      DEV_SITE_STATIC_DIR: /app/base/dev-site/clients/app/dist
    volumes:
      - ../..:/repo:ro
      - ./service/http/data:/data

  caddy:
    depends_on:
      - site

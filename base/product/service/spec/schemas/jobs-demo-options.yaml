type: object
additionalProperties: false
properties:
  dedupe_key:
    type: [ string, "null" ]
    description: Optional dedupe key forwarded to the enqueued job.
  concurrency_key:
    type: [ string, "null" ]
    description: Optional concurrency key forwarded to the enqueued job.
  failures_before_success:
    type: integer
    minimum: 0
    description: >
      For step-b demos: respond 503 this many times before succeeding and enqueueing step-c.
  payload:
    type: object
    additionalProperties: true
    description: Arbitrary JSON echoed through the demo chain.

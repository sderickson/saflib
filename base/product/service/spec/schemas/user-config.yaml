type: object
description: >
  Product-owned preferences for the signed-in user (owner-only). Keyed by Kratos identity id. Holds display name, marketing email consent, and Terms of Service agreement — not auth traits. Kratos owns identity/credentials/sessions; this resource is the Kratos-minimal product DB pattern.
properties:
  user_id:
    type: string
    description: Kratos identity id of the owning user.
    example: "user_abc123"
  display_name:
    type: string
    description: >
      How the user appears to themselves and to others. May be empty after lazy-create until the first save; PUT requires a non-empty trimmed value.
    example: "Alex Rivera"
  marketing_emails_opt_in:
    type: boolean
    description: >
      Explicit consent for product/marketing email. Defaults to false until the user opts in.
    example: false
  marketing_emails_opt_in_at:
    type: [ string, "null" ]
    format: date-time
    description: >
      When the user most recently opted into marketing email. Null when never opted in or after opting out (cleared when `marketing_emails_opt_in` becomes false).
    example: null
  terms_of_service_agreed_at:
    type: [ string, "null" ]
    format: date-time
    description: >
      When the user agreed to the Terms of Service. Null until agreement is recorded (typically via PUT with `terms_of_service_agreed_at: "now"`). Once set, later preference updates do not clear or overwrite it.
    example: null
  created_at:
    type: string
    format: date-time
    description: When the user config row was created.
    example: "2026-07-23T00:00:00Z"
  updated_at:
    type: string
    format: date-time
    description: When the user config row was last updated.
    example: "2026-07-23T12:30:00Z"
required:
  - user_id
  - display_name
  - marketing_emails_opt_in
  - marketing_emails_opt_in_at
  - terms_of_service_agreed_at
  - created_at
  - updated_at
example:
  user_id: "user_abc123"
  display_name: "Alex Rivera"
  marketing_emails_opt_in: false
  marketing_emails_opt_in_at: null
  terms_of_service_agreed_at: null
  created_at: "2026-07-23T00:00:00Z"
  updated_at: "2026-07-23T12:30:00Z"

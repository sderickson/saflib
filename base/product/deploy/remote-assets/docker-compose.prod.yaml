# Cap each container's Docker log (json-file is unbounded by default and
# lives on the boot disk under /var/lib/docker): 3 x 10 MB, rotated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The product's deploy. Requires the platform deploy (deploy/): joins its edge
# network, uses its Kratos, and registers caddy/__product-name__.Caddyfile with
# its edge (`saf-deploy up`).
services:
  __product-name__-monolith:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/saflib-base-monolith:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    memswap_limit: 2G
    volumes:
      - /opt/__product-name__/cron:/app/__product-name__/service/cron/data
      - /opt/__product-name__/db:/app/__product-name__/service/db/data
      - /opt/__product-name__/identity:/app/__product-name__/service/identity/data
      - /opt/__product-name__/identity-http:/app/saflib/identity/identity-http/data
    env_file:
      - ./.env.__product-name__.secrets
    networks:
      - edge

  __product-name__-web:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/saflib-base-deploy-web:latest
    restart: unless-stopped
    env_file:
      - ./env.web
    networks:
      - edge

networks:
  edge:
    name: __organization-name__-edge
    external: true

# Cap each container's Docker log (json-file is unbounded by default and
# lives on the boot disk under /var/lib/docker): 3 x 10 MB, rotated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Platform deploy: the edge (Caddy) and identity (Kratos). Each product deploys
# separately (<product>/deploy), joins the `edge` network and registers its
# routes with the edge (`saf-deploy up`).
services:
  caddy:
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    image: $CONTAINER_REGISTRY/__organization-name__-caddy:latest
    # Fixed name: product deploys register their routes with it (SAF_EDGE_CONTAINER).
    container_name: __organization-name__-edge
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DISABLE_VITE_DEV_SERVER=#
    volumes:
      - caddy_sites:/etc/caddy/sites
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    restart: unless-stopped

  kratos-migrate:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/__organization-name__-kratos:v26.2.0
    # SQL applied lines flood compose logs; keep output only on failure.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/kratos migrate sql -e --yes > /tmp/kratos-migrate.log 2>&1
        status=$$?
        if [ $$status -ne 0 ]; then
          cat /tmp/kratos-migrate.log >&2
          exit $$status
        fi
        echo "kratos-migrate: ok"
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
      - LOG_LEVEL=warn
    volumes:
      - kratos_home:/home/ory
      - /opt/kratos/data:/var/lib/sqlite

  kratos:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/__organization-name__-kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
    env_file:
      - ./.env.kratos.secrets
    volumes:
      - kratos_home:/home/ory
      - /opt/kratos/data:/var/lib/sqlite
    # On the edge network so product services reach its admin API (kratos:4434).
    networks:
      - default
      - edge
    restart: unless-stopped

  node_exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.11.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"

networks:
  edge:
    name: __organization-name__-edge

volumes:
  caddy_data:
    name: __organization-name__-prod-caddy-data
  caddy_config:
    name: __organization-name__-prod-caddy-config
  # Product routes (<product>.Caddyfile), registered by each product's deploy.
  caddy_sites:
    name: __organization-name__-caddy-sites
  kratos_home:
    name: __organization-name__-prod-kratos-home

version: v1.3.1

# WAL + busy_timeout: reduce SQLITE_BUSY under parallel e2e / courier contention.
dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000

serve:
  public:
    base_url: http://kratos.docker.localhost/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://auth.docker.localhost/

  # Only apex and product hosts (no subdomain wildcard — T-9 open redirect).
  allowed_return_urls:
    - http://docker.localhost/
    - http://app.docker.localhost/
    - http://admin.docker.localhost/
    - http://auth.docker.localhost/
    - http://account.docker.localhost/

  flows:
    registration:
      enabled: true
      style: unified
      ui_url: http://auth.docker.localhost/registration
      after:
        password:
          hooks:
            - &kratos_action_webhook
              hook: web_hook
              config:
                url: http://base-monolith:3000/kratos/action
                method: POST
                body: file:///etc/config/kratos/kratos-action-body.jsonnet
                headers:
                  Content-Type: application/json
                response:
                  ignore: true

    login:
      ui_url: http://auth.docker.localhost/login
      after:
        hooks:
          - *kratos_action_webhook
        password:
          hooks:
            - *kratos_action_webhook

    recovery:
      enabled: true
      ui_url: http://auth.docker.localhost/recovery
      after:
        hooks:
          - *kratos_action_webhook

    settings:
      ui_url: http://account.docker.localhost/password
      required_aal: highest_available
      after:
        profile:
          hooks:
            - *kratos_action_webhook
        password:
          hooks:
            - *kratos_action_webhook
        totp:
          hooks:
            - *kratos_action_webhook
        webauthn:
          hooks:
            - *kratos_action_webhook
        passkey:
          hooks:
            - *kratos_action_webhook

    logout:
      after:
        default_browser_return_url: http://auth.docker.localhost/

    verification:
      enabled: true
      ui_url: http://auth.docker.localhost/verification
      use: code

  methods:
    password:
      enabled: true
    passkey:
      enabled: false
    totp:
      enabled: true
      config:
        issuer: Base (Dev)

session:
  whoami:
    required_aal: aal1
  cookie:
    domain: .docker.localhost
    same_site: Lax

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  delivery_strategy: http
  http:
    request_config:
      url: http://base-monolith:3000/email/kratos-courier
      method: POST
      body: file:///etc/config/kratos/courier-body.jsonnet
      headers:
        Content-Type: application/json

# https://www.ory.com/docs/guides/integrate-with-ory-cloud-through-webhooks — default allowlist + proxy headers
clients:
  web_hook:
    header_allowlist:
      - Accept
      - Accept-Encoding
      - Accept-Language
      - Content-Length
      - Content-Type
      - Origin
      - Priority
      - Referer
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform
      - Sec-Fetch-Dest
      - Sec-Fetch-Mode
      - Sec-Fetch-Site
      - Sec-Fetch-User
      - True-Client-Ip
      - User-Agent
      - X-Forwarded-For
      - X-Real-Ip
      - X-Request-ID

# Required for sessions to survive Kratos restarts: without explicit secrets, each
# process start uses new random keys, so existing session cookies cannot be decrypted
# (identities in SQLite still look fine). These are dev-only placeholders, not for prod.
secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

log:
  level: warning
  format: text

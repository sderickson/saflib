name: saflib-base-dev

# Dev stack for the base product (sibling of saflib library packages).
# Compose / build context is the saflib monorepo root (`../..` from this directory).
# Source is bind-mounted at /app; nothing is copied into images, so code changes
# need no rebuild. product/init adds the product layout's saflib/node_modules mask.
#
# Dev data (SQLite databases, Kratos) lives in named volumes with fixed names, never
# in host folders under the checkout. Every checkout of the repo, including git
# worktrees, then runs against the same data, and SQLite stays off Docker Desktop's
# macOS file share (its WAL mmaps -shm, which that share handles badly). The fixed
# project `name` means one stack runs at a time, so there is only ever one writer.
services:
  caddy:
    depends_on:
      - clients
    image: saflib-base-dev:latest
    build:
      context: ../..
      dockerfile: ./base/dev/Dockerfile
    env_file:
      - ./env.caddy
    ports:
      - 80:80
    # The dev-site runs as its own stack (`npm run dev-site`) on host port 3099.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy-config:/etc/caddy/
      - ./caddy-config/evil:/etc/caddy/evil:ro
      - caddy_data:/data
      - caddy_config:/config

  # Installs node_modules into the shared volume when the lockfile changed
  # (no image rebuild needed), then exits. The Node services wait for it.
  deps:
    image: saflib-base-dev-node:latest
    build:
      context: ../..
      dockerfile: ./base/dev/builds/node/Dockerfile
    command:
      - node
      - --experimental-strip-types
      - --disable-warning=ExperimentalWarning
      - /app/docker/dev/install-node-modules.ts
    volumes: &node-volumes
      # Source is bind-mounted; node_modules stays in a Linux-only named volume
      # (the host's macOS builds would shadow it otherwise).
      - ../..:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm

  clients:
    image: saflib-base-dev-node:latest
    depends_on:
      deps:
        condition: service_completed_successfully
    working_dir: /app/base/clients/build
    env_file:
      - ./env.dev
    volumes: *node-volumes
    command: npm run dev

  base-monolith:
    image: saflib-base-dev-node:latest
    depends_on:
      deps:
        condition: service_completed_successfully
    working_dir: /app/base/service/monolith
    # Same env defaults the deploy image applies (see its Dockerfile).
    entrypoint: ["sh", "/app/deploy/scripts/apply-env-defaults.sh"]
    environment:
      - SAF_ENV_DEFAULTS=/app/deploy/__product-name__/env.defaults
    # Restarts when any file it imports changes (service code and saflib alike).
    command:
      - node
      - --watch
      - --experimental-strip-types
      - --disable-warning=ExperimentalWarning
      - ./run.ts
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
      - db_data:/app/base/service/db/data
      - cron_data:/app/base/service/cron/data
      - jobs_data:/app/base/service/jobs/data
    env_file:
      - ./env.dev
      - ./.env

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    # SQL applied lines flood compose logs; keep output only on failure.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/kratos migrate sql -e --yes > /tmp/kratos-migrate.log 2>&1
        status=$$?
        if [ $$status -ne 0 ]; then
          cat /tmp/kratos-migrate.log >&2
          exit $$status
        fi
        echo "kratos-migrate: ok"
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
      - LOG_LEVEL=warn
    volumes:
      # Persists SQLite (identities, sessions, flows) across container restarts
      - kratos_home:/home/ory
      - kratos_data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

  kratos:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
    env_file:
      - ./env.kratos.config
    volumes:
      - kratos_home:/home/ory
      - kratos_data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

volumes:
  caddy_data:
    name: saflib-base-dev-caddy-data
  caddy_config:
    name: saflib-base-dev-caddy-config
  node_modules:
    name: saflib-base-dev-node-modules
  npm_cache:
    name: saflib-base-dev-npm-cache
  kratos_home:
    name: saflib-base-dev-kratos-home
  kratos_data:
    name: saflib-base-dev-kratos-data
  db_data:
    name: saflib-base-dev-db-data
  cron_data:
    name: saflib-base-dev-cron-data
  jobs_data:
    name: saflib-base-dev-jobs-data

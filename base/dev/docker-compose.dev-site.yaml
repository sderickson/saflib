name: saflib-base-dev-site

# Standalone dev-site (built image only). UI + API at http://localhost:3099
services:
  site:
    image: saflib-dev-site:latest
    build:
      context: ../..
      dockerfile: dev-site/dev-site-docker/Dockerfile
    ports:
      - "3099:3099"
    environment:
      NODE_ENV: production
      TZ: UTC
      DEPLOYMENT_NAME: development
      DOMAIN: localhost
      PROTOCOL: http
      CLIENT_SUBDOMAINS: ""
      ADMIN_EMAILS: "admin@saflib.com"
      ALLOW_DB_CREATION: "true"
      DEV_SITE_SERVICE_HTTP_HOST: "0.0.0.0:3099"
      DEV_SITE_REPO_ROOT: /repo
      SAFLIB_ROOT: ${DEV_SITE_SAFLIB_ROOT:-/repo/saflib}
      DEV_SITE_PRODUCT_ROOT: ${DEV_SITE_PRODUCT_ROOT:-base}
      DEV_SITE_MAIN_REF: main
      DEV_SITE_DB_PATH: /data/dev-site.sqlite
      DEV_SITE_GITHUB_REPO: sderickson/saflib
    volumes:
      # Read-write: workflow "update" steps (see @saflib/new-workflows) edit
      # files here directly, same repo checkout the host sees.
      - ${DEV_SITE_REPO_MOUNT:-../..}:/repo
      # Isolated from the host: a Linux npm install inside the container
      # (e.g. an agent fixing a missing package) must never touch the
      # host's own native bindings, and vice versa. docker-entrypoint.sh
      # seeds/updates this on every start.
      - repo_node_modules:/repo/node_modules
      - ./dev-site-data:/data
      # Host's Claude Code OAuth session (see resolve-claude-credentials.sh).
      # Read-write so the container's own token refresh writes back to it.
      - ./.claude-credentials.json:/home/node/.claude/.credentials.json

volumes:
  repo_node_modules:
    name: saflib-base-dev-site-repo-node-modules
